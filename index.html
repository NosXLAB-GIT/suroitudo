<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SỰ RƠI TRONG KHÔNG KHÍ — Từ Triết Học Cổ Đại Đến Cơ Học Cổ Điển</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060913">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,500;1,700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   1. GLOBAL TOKENS
   =================================================================== */
:root {
  --bg-deep:    #060913;
  --bg-surface: #0c1224;
  --bg-card:    rgba(10,16,36,0.82);
  --brass:      #d4af37;
  --brass-light:#f6e082;
  --brass-dark: #a07a10;
  --brass-glow: rgba(212,175,55,0.38);
  --cyan:       #38bdf8;
  --cyan-glow:  rgba(56,189,248,0.5);
  --red-glow:   rgba(239,68,68,0.6);
  --text-main:  #f8fafc;
  --text-dim:   #94a3b8;
  --border-glass: rgba(212,175,55,0.22);
  --border-cyan:  rgba(56,189,248,0.3);

  --u: min(1vw, 1.7778vh);
  --e: cubic-bezier(0.16,1,0.3,1);
  --pop: cubic-bezier(0.34,1.56,0.64,1);
  --g:  cubic-bezier(0.55,0.085,0.68,0.53);
  --sharp: cubic-bezier(0.4,0,0.2,1);

  --f-disp: 'Cinzel Decorative','Playfair Display',Georgia,serif;
  --f-cin:  'Cinzel','Playfair Display',Georgia,serif;
  --f-ser:  'Playfair Display',Georgia,serif;
  --f-body: 'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  --f-mono: 'JetBrains Mono',monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#02040b}
body{
  display:grid;place-items:center;
  font-family:var(--f-body);color:var(--text-main);
  overscroll-behavior:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* 16:9 Stage */
#stage{
  position:relative;
  width:min(100vw,177.78vh);
  aspect-ratio:16/9;
  overflow:hidden;
  background:var(--bg-deep);
  font-size:calc(var(--u)*1.55);
  line-height:1.65;
  isolation:isolate;
}
#deck{position:absolute;inset:0;z-index:1}

/* ===================================================================
   2. SLIDE LIFECYCLE
   =================================================================== */
.sc{
  position:absolute;inset:0;display:none;z-index:1;overflow:hidden;
}
.sc.on,.sc.out{display:block}
.sc.on{z-index:2}
.sc.out{z-index:1}
.sc.gone{display:none!important}
.sc:not(.on):not(.out) *{animation-play-state:paused!important}

/* Background gradient themes */
.bgl{
  position:absolute;inset:-8%;
  transition:background 0.8s;
  background:
    radial-gradient(ellipse at 75% 15%,rgba(212,175,55,0.14) 0%,transparent 50%),
    radial-gradient(ellipse at 15% 85%,rgba(56,189,248,0.1) 0%,transparent 50%),
    linear-gradient(145deg,#040711 0%,#0a1020 50%,#030609 100%);
}
.sc[data-th="parchment"] .bgl{
  background:
    radial-gradient(ellipse at 65% 25%,rgba(217,119,6,0.18) 0%,transparent 55%),
    radial-gradient(ellipse at 20% 80%,rgba(99,102,241,0.08) 0%,transparent 45%),
    linear-gradient(135deg,#06090f 0%,#0e1428 55%,#060a10 100%);
}
.sc[data-th="vacuum"] .bgl{
  background:
    radial-gradient(ellipse at 50% 40%,rgba(56,189,248,0.18) 0%,transparent 60%),
    radial-gradient(ellipse at 90% 85%,rgba(14,165,233,0.14) 0%,transparent 45%),
    linear-gradient(170deg,#02040b 0%,#06112a 55%,#020409 100%);
}
.sc[data-th="finale"] .bgl{
  background:
    radial-gradient(ellipse at 50% 50%,rgba(212,175,55,0.22) 0%,transparent 55%),
    radial-gradient(ellipse at 15% 20%,rgba(56,189,248,0.12) 0%,transparent 50%),
    linear-gradient(145deg,#050810 0%,#0c1225 55%,#040710 100%);
}

/* Camera slow dolly */
.cam{position:absolute;inset:0}
.sc.on .cam{animation:camDolly 24s ease-in-out infinite alternate}
@keyframes camDolly{from{scale:1}to{scale:1.028}}

/* Reveal enter/exit */
.sc:not(.on):not(.out) .rv{opacity:0}
.sc.on .rv{
  animation:rvIn 1.1s var(--e)
    calc(var(--b,0.1s) + var(--i,0)*0.11s) both;
}
.sc.out .rv{animation:rvOut 0.42s var(--e) both}
@keyframes rvIn{
  from{opacity:0;transform:translateY(calc(var(--u)*2.4))}
  to  {opacity:1;transform:translateY(0)}
}
@keyframes rvOut{
  to{opacity:0;transform:translateY(calc(var(--u)*-1.8))}
}

/* ===================================================================
   3. TYPOGRAPHY SYSTEM
   =================================================================== */
.kicker{
  display:inline-flex;align-items:center;gap:calc(var(--u)*1.3);
  font:700 calc(var(--u)*1.0)/1.4 var(--f-mono);
  letter-spacing:0.26em;text-transform:uppercase;color:var(--brass);
  text-shadow:0 0 calc(var(--u)*1.2) var(--brass-glow);
}
.kicker::before{
  content:"";width:calc(var(--u)*3.4);height:1.5px;
  background:currentColor;transform-origin:left;scale:0 1;
}
.sc.on .kicker::before{animation:kickLine 0.9s var(--e) 0.12s both}
@keyframes kickLine{to{scale:1 1}}

.headline{
  font-family:var(--f-cin);font-weight:700;
  font-size:calc(var(--u)*3.9);line-height:1.18;color:var(--text-main);
  letter-spacing:0.01em;
}
.headline.lg{font-size:calc(var(--u)*4.7)}
.hline{display:block;perspective:1000px;padding:0.04em 0 0.1em;overflow:visible}
.wd{display:inline-block;white-space:nowrap}

/* Character flip-in with metallic shimmer */
.ch{
  display:inline-block;position:relative;color:var(--text-main);opacity:0;
  transform-origin:50% 90%;
  scale:calc(1+var(--p,0)*0.22);
  text-shadow:0 0 calc(var(--u)*1.2*var(--p,0)) var(--cyan-glow);
}
.sc.on .ch{
  animation:chFlip 1.2s var(--e)
    calc(var(--b,0.1s)+var(--l,0)*0.14s+var(--c,0)*0.022s) both;
}
@keyframes chFlip{
  from{opacity:0;transform:translateY(0.5em) rotateX(-65deg)}
  to  {opacity:1;transform:translateY(0) rotateX(0)}
}
.ch::after{
  content:attr(data-c);position:absolute;left:0;top:0;pointer-events:none;
  background:linear-gradient(118deg,
    transparent 0%,rgba(255,255,255,0.08) 38%,
    #fff9 46%,var(--brass-light) 56%,
    rgba(212,175,55,0.3) 66%,transparent 100%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  animation:goldSweep 9s linear infinite;
  animation-delay:calc(var(--c,0)*-0.2s);
}
@keyframes goldSweep{0%{background-position:150% 0}100%{background-position:-150% 0}}

/* Word reveals */
.pw{display:inline-block;opacity:0}
.sc.on .pw{
  animation:wordIn 0.82s var(--e)
    calc(var(--b,0.15s)+var(--w,0)*0.024s) both;
}
@keyframes wordIn{
  from{opacity:0;transform:translateY(0.55em)}
  to  {opacity:1;transform:translateY(0)}
}

.lead-text{
  font-size:calc(var(--u)*1.52);line-height:1.78;color:#cbd5e1;
  text-shadow:0 2px calc(var(--u)*1) rgba(0,0,0,0.75);
}
.lead-text b{color:#fff;font-weight:600}
.lead-text em{color:var(--brass-light);font-style:normal}

/* ===================================================================
   4. GLASS CARDS & BRASS FRAMES
   =================================================================== */
.glass-card{
  background:linear-gradient(145deg,rgba(14,22,46,0.88),rgba(8,14,30,0.92));
  border:1px solid var(--border-glass);
  border-radius:calc(var(--u)*1.3);
  padding:calc(var(--u)*1.8) calc(var(--u)*2.2);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:
    0 calc(var(--u)*1.5) calc(var(--u)*4.5) rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 0 0 1px rgba(212,175,55,0.08);
  position:relative;overflow:hidden;
}
.glass-card::before{
  content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,0.09),transparent);
  animation:glassSweep 11s ease-in-out infinite;
  animation-delay:calc(var(--i,0)*-2.2s);pointer-events:none;
}
@keyframes glassSweep{0%,55%{transform:translateX(0)}100%{transform:translateX(360%)}}

/* Brass-bordered media frame */
.media-frame{
  position:relative;border-radius:calc(var(--u)*1);overflow:hidden;
  border:1.5px solid rgba(212,175,55,0.3);background:#000;
  box-shadow:
    0 calc(var(--u)*1.6) calc(var(--u)*4) rgba(0,0,0,0.65),
    0 0 calc(var(--u)*2.5) rgba(212,175,55,0.15);
  transition:transform 0.4s var(--pop),border-color 0.4s,box-shadow 0.4s;
  cursor:pointer;
}
.media-frame:hover{
  transform:translateY(calc(var(--u)*-0.6)) scale(1.025);
  border-color:var(--brass-light);
  box-shadow:
    0 calc(var(--u)*2.5) calc(var(--u)*6.5) rgba(0,0,0,0.8),
    0 0 calc(var(--u)*3.5) var(--brass-glow);
}
.media-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.6s var(--e)}
.media-frame:hover img{transform:scale(1.06)}
.media-caption{
  position:absolute;left:0;right:0;bottom:0;
  padding:calc(var(--u)*0.7) calc(var(--u)*1.1);
  background:linear-gradient(0deg,rgba(4,7,18,0.95) 0%,rgba(4,7,18,0.6) 65%,transparent 100%);
  font:600 calc(var(--u)*1.0) var(--f-body);color:#e2e8f0;
  display:flex;align-items:center;justify-content:space-between;
}
.media-caption .zoom-hint{
  font:500 calc(var(--u)*0.82) var(--f-mono);color:var(--brass);
  background:rgba(212,175,55,0.18);padding:1px 7px;border-radius:3px;
}

/* Gold badge */
.gold-badge{
  display:inline-flex;align-items:center;gap:calc(var(--u)*0.7);
  padding:calc(var(--u)*0.55) calc(var(--u)*1.4);border-radius:99px;
  font:700 calc(var(--u)*1.0)/1.2 var(--f-mono);color:#fff;
  background:linear-gradient(135deg,#8b5e08,var(--brass),#8b5e08);
  box-shadow:0 calc(var(--u)*0.7) calc(var(--u)*2) rgba(140,90,10,0.55),
             inset 0 1px 0 rgba(255,255,255,0.4);
  letter-spacing:0.08em;text-transform:uppercase;
}

/* ===================================================================
   5. SLIDE-SPECIFIC LAYOUTS
   =================================================================== */
/* Welcome / Opener / Thank You Centered Content */
.hero-opener-content{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:88%;
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
.astrolabe-ring{
  position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;
}
.astrolabe-ring:nth-child(1){
  width:calc(var(--u)*72);height:calc(var(--u)*72);
  transform:translate(-50%,-50%);
  border:1.5px dashed rgba(212,175,55,0.2);
  animation:spinAstro 110s linear infinite;
}
.astrolabe-ring:nth-child(2){
  width:calc(var(--u)*54);height:calc(var(--u)*54);
  transform:translate(-50%,-50%);
  border:1px solid rgba(56,189,248,0.14);
  animation:spinAstro 70s linear infinite reverse;
}
.astrolabe-ring:nth-child(3){
  width:calc(var(--u)*38);height:calc(var(--u)*38);
  transform:translate(-50%,-50%);
  border:0.5px dashed rgba(212,175,55,0.1);
  animation:spinAstro 45s linear infinite;
}
@keyframes spinAstro{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* Members strip */
.members-strip{
  position:absolute;bottom:0;left:0;right:0;
  padding:calc(var(--u)*0.6) calc(var(--u)*5);
  background:linear-gradient(90deg,
    transparent,rgba(6,9,19,0.9) 10%,rgba(6,9,19,0.9) 90%,transparent);
  border-top:1px solid rgba(212,175,55,0.15);
  display:flex;align-items:center;gap:calc(var(--u)*0.5);
  overflow:hidden;z-index:10;
}
.members-strip-inner{
  display:flex;gap:calc(var(--u)*3);
  animation:marqueeScroll 28s linear infinite;
  white-space:nowrap;
}
.members-strip-inner span{
  font:600 calc(var(--u)*1.0) var(--f-body);
  color:rgba(244,236,216,0.72);letter-spacing:0.04em;
}
.members-strip-inner span::before{
  content:"◈ ";color:var(--brass);opacity:0.6;
}
@keyframes marqueeScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Two-Column Content Layouts */
.split-layout-2{
  position:absolute;
  inset:calc(var(--u)*13.5) calc(var(--u)*7) calc(var(--u)*5.5) calc(var(--u)*7);
  display:grid;grid-template-columns:1.12fr 0.98fr;gap:calc(var(--u)*3.5);
  align-items:center;
}
.parchment-sheet{
  background:linear-gradient(148deg,#fdf9ef 0%,#f5ecda 60%,#ede0c4 100%);
  border:1px solid #c9b98a;border-radius:calc(var(--u)*1.1);
  padding:calc(var(--u)*2.2);color:#1c1917;
  box-shadow:
    0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,0.5),
    inset 0 0 calc(var(--u)*3) rgba(205,185,138,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.4);
  position:relative;overflow:hidden;
}
.parchment-sheet::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 28px,rgba(0,0,0,0.04) 28px,rgba(0,0,0,0.04) 29px
  );
}

/* Slide Pisa */
.pisa-slide-grid{
  position:absolute;
  inset:calc(var(--u)*13.5) calc(var(--u)*7) calc(var(--u)*5.5) calc(var(--u)*7);
  display:grid;grid-template-columns:1.08fr 0.92fr;gap:calc(var(--u)*3.5);
  align-items:center;
}
.dual-gallery{
  display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.6);
  height:calc(var(--u)*36);
}
.dual-gallery .media-frame{height:100%}

/* Slide Cinema */
.cinema-slide-container{
  position:absolute;
  inset:calc(var(--u)*13) calc(var(--u)*7) calc(var(--u)*5) calc(var(--u)*7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.cinema-screen-box{
  position:relative;width:78%;aspect-ratio:16/9;max-height:calc(var(--u)*34);
  border-radius:calc(var(--u)*1.2);overflow:hidden;
  border:2px solid var(--brass);background:#000;
  box-shadow:
    0 0 calc(var(--u)*5) var(--brass-glow),
    0 0 calc(var(--u)*12) rgba(212,175,55,0.15),
    0 calc(var(--u)*3) calc(var(--u)*9) rgba(0,0,0,0.9);
}
.cinema-screen-box video{
  width:100%;height:100%;object-fit:contain;background:#000;display:block;
}
.cinema-rec-badge{
  position:absolute;top:calc(var(--u)*1);left:calc(var(--u)*1.3);
  display:flex;align-items:center;gap:calc(var(--u)*0.7);
  font:700 calc(var(--u)*0.85) var(--f-mono);color:var(--brass);
  background:rgba(4,7,18,0.88);
  padding:calc(var(--u)*0.35) calc(var(--u)*0.9);
  border-radius:99px;border:1px solid var(--border-glass);z-index:5;
}
.rec-dot{
  width:calc(var(--u)*0.65);aspect-ratio:1;border-radius:50%;
  background:#ef4444;animation:recPulse 1.3s ease-in-out infinite;
}
@keyframes recPulse{50%{opacity:0.15}}

/* Slide Newton */
.newton-slide-grid{
  position:absolute;
  inset:calc(var(--u)*13.5) calc(var(--u)*6.5) calc(var(--u)*5.5) calc(var(--u)*6.5);
  display:grid;grid-template-columns:1.05fr 1fr;gap:calc(var(--u)*3.2);
  align-items:center;
}
.newton-media-layout{
  display:grid;grid-template-columns:1.15fr 1fr;gap:calc(var(--u)*1.4);
  height:calc(var(--u)*36);
}
.newton-media-layout .video-col{
  border-radius:calc(var(--u)*1);overflow:hidden;
  border:1.5px solid var(--brass);background:#000;
  box-shadow:0 0 calc(var(--u)*2.5) var(--brass-glow);
  position:relative;
}
.newton-media-layout .video-col video{
  width:100%;height:100%;object-fit:cover;display:block;
}
.newton-media-layout .photos-col{
  display:flex;flex-direction:column;gap:calc(var(--u)*1.3);height:100%;
}
.newton-media-layout .photos-col .media-frame{flex:1;min-height:0}

/* Slide Conclusion */
.finale-slide-grid{
  position:absolute;
  inset:calc(var(--u)*13.5) calc(var(--u)*7) calc(var(--u)*5.5) calc(var(--u)*7);
  display:grid;grid-template-columns:1.12fr 0.92fr;gap:calc(var(--u)*3.5);
  align-items:center;
}
.finale-gallery{
  display:grid;grid-template-columns:1fr 1.1fr;gap:calc(var(--u)*1.6);
  height:calc(var(--u)*36);
}
.tri-tribute-cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.0);
  margin-top:calc(var(--u)*1.2);
}
.tribute-step{
  padding:calc(var(--u)*0.95) calc(var(--u)*1.1);
  background:rgba(10,18,42,0.78);
  border:1px solid var(--border-glass);
  border-radius:calc(var(--u)*0.8);text-align:center;
  transition:transform 0.3s var(--pop),border-color 0.3s;
}
.tribute-step:hover{transform:translateY(calc(var(--u)*-0.4));border-color:var(--brass)}
.tribute-step b{display:block;color:var(--brass);font:700 calc(var(--u)*1.05) var(--f-mono);margin-bottom:3px}
.tribute-step span{font-size:calc(var(--u)*0.9);color:#cbd5e1}

/* ===================================================================
   6. SIGNATURE TRANSITION: GRAVITATIONAL CURTAIN
   =================================================================== */
#grav-curtain{
  position:absolute;inset:0;z-index:50;pointer-events:none;
  background:radial-gradient(ellipse at 50% 90%,#101830,#060913 80%);
  transform:translateY(-100%);will-change:transform;
}
#grav-curtain.anim-fwd{animation:curtainFwd 1.28s var(--g) both}
#grav-curtain.anim-bwd{animation:curtainBwd 1.12s var(--e) both}
@keyframes curtainFwd{
  0%  {transform:translateY(-100%)}
  44% {transform:translateY(0%)}
  56% {transform:translateY(0%)}
  100%{transform:translateY(100%)}
}
@keyframes curtainBwd{
  0%  {transform:translateY(100%)}
  44% {transform:translateY(0%)}
  56% {transform:translateY(0%)}
  100%{transform:translateY(-100%)}
}
.impact-wave{
  position:absolute;left:50%;top:50%;
  width:calc(var(--u)*14);aspect-ratio:1;border-radius:50%;
  border:2px solid var(--brass);transform:translate(-50%,-50%) scale(0.1);
  animation:impactRing 0.95s ease-out forwards;
  pointer-events:none;z-index:45;opacity:0.8;
}
@keyframes impactRing{to{transform:translate(-50%,-50%) scale(9);opacity:0}}

/* ===================================================================
   7. CHROME UI
   =================================================================== */
#ornament-frame{
  position:absolute;inset:calc(var(--u)*1.8);z-index:25;pointer-events:none;
  border:1px solid rgba(212,175,55,0.2);
}
#ornament-frame::before{
  content:"";position:absolute;inset:calc(var(--u)*0.5);
  border:0.5px solid rgba(212,175,55,0.1);
}
.bracket{
  position:absolute;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);
  color:var(--brass);filter:drop-shadow(0 0 calc(var(--u)*0.5) var(--brass-glow));
}
.bracket.tl{top:-2px;left:-2px}
.bracket.tr{top:-2px;right:-2px;transform:rotate(90deg)}
.bracket.br{bottom:-2px;right:-2px;transform:rotate(180deg)}
.bracket.bl{bottom:-2px;left:-2px;transform:rotate(270deg)}

#ui-chrome{
  position:absolute;inset:0;z-index:30;pointer-events:none;
  font-family:var(--f-mono);
}
#counter{
  position:absolute;left:calc(var(--u)*4.5);bottom:calc(var(--u)*3.6);
  font-size:calc(var(--u)*1.1);letter-spacing:0.24em;color:var(--brass);
  font-weight:700;text-shadow:0 0 calc(var(--u)*1) var(--brass-glow);
}
#progress{
  position:absolute;left:calc(var(--u)*4.5);bottom:calc(var(--u)*3.0);
  width:calc(var(--u)*14);height:2.5px;

/* ===================================================================
   4. AMBIENT: FEATHER + DUST
   =================================================================== */
const FeatherCanvas=(()=>{
  const cv=document.getElementById('feather-canvas');
  const ctx=cv.getContext('2d');
  let W=0,H=0;
  const feathers=[];
  function resize(){
    const r=stage.getBoundingClientRect();
    const dpr=Math.min(devicePixelRatio||1,2);
    W=cv.width=Math.round(r.width*dpr);
    H=cv.height=Math.round(r.height*dpr);
    cv.style.width=r.width+'px';
    cv.style.height=r.height+'px';
  }
  function mkFeather(){
    return{
      x:Math.random()*W,
      y:Math.random()*H-H,
      vx:(Math.random()-0.5)*0.4,
      vy:0.3+Math.random()*0.5,
      angle:Math.random()*Math.PI*2,
      av:(Math.random()-0.5)*0.02,
      len:12+Math.random()*18,
      alpha:0.1+Math.random()*0.28,
      sway:Math.random()*Math.PI*2,
      swaySpeed:0.008+Math.random()*0.012
    };
  }
  function init(){
    resize();
    for(let i=0;i<22;i++){
      const f=mkFeather();
      f.y=Math.random()*H;
      feathers.push(f);
    }
  }
  function drawFeather(f){
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.angle);
    ctx.globalAlpha=f.alpha;
    ctx.strokeStyle='rgba(243,234,216,0.9)';
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(0,-f.len/2);ctx.lineTo(0,f.len/2);ctx.stroke();
    ctx.lineWidth=0.5;
    const steps=Math.floor(f.len/2.2);
    for(let i=0;i<steps;i++){
      const y=-f.len/2+i*2.2;
      const spread=(f.len*0.38)*(1-Math.abs(i/steps-0.5)*1.6);
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(-spread,y+spread*0.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(spread,y+spread*0.5);ctx.stroke();
    }
    ctx.restore();
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const f of feathers){
      f.sway+=f.swaySpeed;
      f.x+=f.vx+Math.sin(f.sway)*0.6;
      f.y+=f.vy;
      f.angle+=f.av;
      if(f.y>H+30)Object.assign(f,mkFeather());
      drawFeather(f);
    }
    requestAnimationFrame(tick);
  }
  return{init,resize,tick};
})();

const Dust=(()=>{
  const cv=document.getElementById('dust');
  const ctx=cv.getContext('2d');
  let W=0,H=0,P=[];
  function resize(){
    const r=stage.getBoundingClientRect();
    const dpr=Math.min(devicePixelRatio||1,1.5);
    W=cv.width=Math.round(r.width*dpr);
    H=cv.height=Math.round(r.height*dpr);
    cv.style.width=r.width+'px';
    cv.style.height=r.height+'px';
  }
  function init(){
    resize();
    P=Array.from({length:38},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:0.6+Math.random()*1.6,
      vx:(Math.random()-0.5)*0.25,vy:0.15+Math.random()*0.35,
      alpha:0.3+Math.random()*0.5
    }));
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      p.x+=p.vx;p.y+=p.vy;
      if(p.y>H+5){p.y=-5;p.x=Math.random()*W}
      if(p.x<-5)p.x=W+5;
      if(p.x>W+5)p.x=-5;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle=`rgba(212,175,55,${p.alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  return{init,resize,tick};
})();

/* ===================================================================
   5. POINTER PARALLAX
   =================================================================== */
let mx=0,my=0,smx=0,smy=0;
stage.addEventListener('mousemove',e=>{
  const r=stage.getBoundingClientRect();
  mx=(e.clientX-r.left)/r.width*2-1;
  my=(e.clientY-r.top)/r.height*2-1;
});
function parallaxTick(){
  smx+=(mx-smx)*0.07;
  smy+=(my-smy)*0.07;
  const layers=document.querySelectorAll('.sc.on .parallax-layer');
  layers.forEach(el=>{
    const d=parseFloat(el.dataset.depth)||0.3;
    el.style.transform=`translate(${smx*d*18}px,${smy*d*10}px)`;
  });
  requestAnimationFrame(parallaxTick);
}

   =================================================================== */
const notesDrawer=document.getElementById('notes-drawer');
const notesTitle=document.getElementById('notes-title');
const notesContent=document.getElementById('notes-content');

function updateUI(){
  counterEl.textContent=`${String(cur+1).padStart(2,'0')} / ${String(SLIDES.length).padStart(2,'0')}`;
  progressEl.style.transform=`scaleX(${(cur+1)/SLIDES.length})`;
  notesTitle.textContent=`LỜI DẪN: ${SLIDES[cur].name.toUpperCase()}`;
  notesContent.textContent=SLIDES[cur].notes||'';
}

function goTo(idx,dir=1){
  if(navigating||idx===cur||idx<0||idx>=SLIDES.length)return;
  navigating=true;

  ['player-vid01','player-2mp4'].forEach(id=>{
    const v=document.getElementById(id);
    if(v)v.pause();
  });

  const secs=document.querySelectorAll('.sc');
  const from=secs[cur],to=secs[idx];

  curtain.className=dir>0?'anim-fwd':'anim-bwd';

  setTimeout(()=>{
    from.classList.remove('on');from.classList.add('gone');
    to.classList.remove('gone');to.classList.add('on');
    cur=idx;updateUI();

    const ring=document.createElement('div');
    ring.className='impact-wave';
    stage.appendChild(ring);
    setTimeout(()=>ring.remove(),950);
  },560);

  setTimeout(()=>{
    curtain.className='';
    navigating=false;
  },1280);
}
window.goToSlideIndex=idx=>goTo(idx,idx>cur?1:-1);

/* Wheel */
let wDelta=0,wTimer=null;
window.addEventListener('wheel',e=>{
  if(document.body.classList.contains('edit-mode'))return;
  if(document.getElementById('lightbox').classList.contains('active'))return;
  if(e.target.closest('#notes-drawer'))return;
  e.preventDefault();
  if(navigating)return;
  wDelta+=e.deltaY;
  clearTimeout(wTimer);
  wTimer=setTimeout(()=>{wDelta=0},140);
  if(Math.abs(wDelta)>55){
    const d=wDelta>0?1:-1;
    wDelta=0;goTo(cur+d,d);
  }
},{passive:false});

/* Touch */
let tY=0;
window.addEventListener('touchstart',e=>{tY=e.touches[0].clientY},{passive:true});
window.addEventListener('touchend',e=>{
  const diff=tY-e.changedTouches[0].clientY;
  if(Math.abs(diff)>50)goTo(cur+(diff>0?1:-1),diff>0?1:-1);
},{passive:true});

/* Keys */
window.addEventListener('keydown',e=>{
  if(e.target.matches('textarea,input'))return;
  if(e.key==='Escape'){closeAll();return}
  if(['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();goTo(cur+1,1)}
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goTo(cur-1,-1)}
  else if(e.key==='Home'){e.preventDefault();goTo(0,-1)}
  else if(e.key==='End'){e.preventDefault();goTo(SLIDES.length-1,1)}
  else if(e.key==='g'||e.key==='G')toggleGrid();
  else if(e.key==='n'||e.key==='N')toggleNotes();
  else if(e.key==='s'||e.key==='S')toggleEditor();
  else if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

/* ===================================================================
   7. LIGHTBOX, GRID, NOTES & EDITOR
   =================================================================== */
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lightbox-img');
window.openLightbox=src=>{lbImg.src=src;lightbox.classList.add('active')};
document.getElementById('lightbox-close').addEventListener('click',()=>lightbox.classList.remove('active'));
lightbox.addEventListener('click',e=>{if(e.target===lightbox)lightbox.classList.remove('active')});

const modalGrid=document.getElementById('modal-grid');
const gridShelf=document.getElementById('grid-shelf');
function toggleGrid(){
  const open=modalGrid.classList.toggle('active');
  if(open){
    gridShelf.innerHTML=SLIDES.map((s,idx)=>`
      <div class="grid-thumb ${idx===cur?'cur':''}" data-idx="${idx}">
        <b>${String(idx+1).padStart(2,'0')}</b>
        <span>${s.name}</span>
      </div>
    `).join('');
    gridShelf.querySelectorAll('.grid-thumb').forEach(t=>{
      t.addEventListener('click',()=>{
        const idx=parseInt(t.dataset.idx,10);
        modalGrid.classList.remove('active');
        goTo(idx,idx>cur?1:-1);
      });
    });
  }
}

function toggleNotes(){
  notesDrawer.classList.toggle('active');
}
document.getElementById('btn-notes-toggle').addEventListener('click',toggleNotes);
document.getElementById('notes-close').addEventListener('click',()=>notesDrawer.classList.remove('active'));
document.getElementById('btn-grid-toggle').addEventListener('click',toggleGrid);

function toggleEditor(){
  const open=document.body.classList.toggle('edit-mode');
  if(open)buildEditor();
}
function closeAll(){
  lightbox.classList.remove('active');
  modalGrid.classList.remove('active');
  notesDrawer.classList.remove('active');
  document.body.classList.remove('edit-mode');
}
document.getElementById('btn-editor-open').addEventListener('click',toggleEditor);
document.getElementById('btn-editor-close').addEventListener('click',toggleEditor);

function buildEditor(){
  const s=SLIDES[cur];
  const f=document.getElementById('editor-fields');
  f.innerHTML=`
    <h3 style="color:var(--brass);margin-bottom:12px;">${s.name}</h3>
    <label>Kicker:</label>
    <textarea id="ed-kicker" rows="2">${s.kicker}</textarea>
    <label>Dòng tiêu đề 1:</label>
    <textarea id="ed-t1" rows="2">${s.title[0]||''}</textarea>
    <label>Dòng tiêu đề 2:</label>
    <textarea id="ed-t2" rows="2">${s.title[1]||''}</textarea>
    <label>Lời dẫn thuyết trình:</label>
    <textarea id="ed-notes" rows="6">${s.notes||''}</textarea>
  `;
  f.querySelectorAll('textarea').forEach(ta=>{
    ta.addEventListener('input',()=>{
      s.kicker=document.getElementById('ed-kicker').value;
      s.title[0]=document.getElementById('ed-t1').value;
      s.title[1]=document.getElementById('ed-t2').value;
      s.notes=document.getElementById('ed-notes').value;
      updateUI();
    });
  });
}

document.getElementById('input-galileo-video').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const url=URL.createObjectURL(file);
  const v=document.getElementById('player-vid01');
  if(v){v.src=url;v.play();}
});
document.getElementById('input-newton-video').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const url=URL.createObjectURL(file);
  const v=document.getElementById('player-2mp4');
  if(v){v.src=url;v.play();}
});

document.getElementById('btn-save-html').addEventListener('click',()=>{
  const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Su-Roi-Trong-Khong-Khi.html';
  a.click();
});

/* ===================================================================
   8. INIT
   =================================================================== */
renderSlides();
FeatherCanvas.init();FeatherCanvas.tick();
Dust.init();Dust.tick();
parallaxTick();

const secs=document.querySelectorAll('.sc');
secs[0].classList.add('on');
updateUI();

window.addEventListener('resize',()=>{
  FeatherCanvas.resize();
  Dust.resize();
});

})();
</script>
</body>
</html>
