<style>
/*FONTS_INLINE*/
/* =====================================================================
   1. TOKENS
   ===================================================================== */
:root{
  --bg-deep:#03040d; --bg-mid:#0a0e2b; --paper:#eaf1ff;
  --accent:#5b8cff; --highlight:#b26bff;
  --text:#f5f7ff; --text-dim:#a4aedc;
  --u:min(1vw,1.7778vh);                         /* 1% of the 16:9 stage width */
  --e:cubic-bezier(.16,1,.3,1);                  /* main ease */
  --pop:cubic-bezier(.34,1.56,.64,1);            /* overshoot */
  --g:cubic-bezier(.55,.085,.68,.53);            /* ease-in-quad = gravity */
  --dir:1; --b:.15s; --i:0; --d:0; --mx:0; --my:0; --p:0;
  --f-disp:'Be Vietnam Pro','Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif;
  --f-ser:'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#03040d}
body{display:grid;place-items:center;font-family:var(--f-disp);color:var(--text);overscroll-behavior:none;transition:background .9s;
  --ui:#d4dcff;--ui-d:rgba(212,220,255,.45);--frame:rgba(120,150,255,.42);--vig:.62;--dust:190,205,255}
body[data-th=vivid]{--frame:rgba(185,150,255,.5)}
body[data-th=paper]{background:#d7e5ff;--ui:#0b1440;--ui-d:rgba(11,20,64,.45);--frame:rgba(30,50,130,.45);--vig:.1;--dust:47,85,212}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--highlight);outline-offset:3px}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:var(--bg-deep);
  font-size:calc(var(--u)*1.6);line-height:1.5;isolation:isolate;--dir:1}
#deck{position:absolute;inset:0;z-index:1}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#03040d;z-index:999;font:600 18px var(--f-disp)}

/* =====================================================================
   3. SLIDE SYSTEM  (hidden · .pre · .on · .out · .gone, plus .fall/.under/.top during transitions)
   ===================================================================== */
.sc{position:absolute;inset:0;display:none;z-index:1;overflow:hidden;color:var(--tx);
  --tx:var(--text);--txd:var(--text-dim);--ac:var(--accent);--hl:var(--highlight);--glow:178,107,255;--acc:91,140,255;
  --panel:rgba(10,14,43,.66);--line:rgba(140,165,255,.38);--m1:#d6e2ff;--m2:#7fa2ff;--m3:#fff;--star:#fff;--b:.15s}
.sc[data-th=vivid]{--ac:#8aaaff;--hl:#d994ff;--panel:rgba(20,12,70,.64)}
.sc[data-th=paper]{--tx:#0b1440;--txd:#34447f;--ac:#2549c8;--hl:#6d33d6;--glow:47,85,212;--acc:37,73,200;
  --panel:rgba(255,255,255,.72);--line:rgba(30,50,130,.35);--m1:#0b1440;--m2:#3a62e0;--m3:#8fb0ff;--star:#0b1440}
.sc.pre{display:block;visibility:hidden}
.sc.on,.sc.out,.sc.fall,.sc.under{display:block}
.sc.on,.sc.out{z-index:2}
.sc.fall,.sc.top{z-index:3}
.sc.fall{will-change:translate}
.sc.gone{display:none}
/* pause EVERYTHING in slides that are not live */
.sc:not(.on):not(.out):not(.fall):not(.under) *,.sc:not(.on):not(.out):not(.fall):not(.under) *::before,.sc:not(.on):not(.out):not(.fall):not(.under) *::after{animation-play-state:paused!important}
.cam{position:absolute;inset:0;transform-origin:50% 55%}
.sc.on .cam{animation:cam 18s ease-in-out infinite alternate}
.sc[data-k=open].on .cam{animation:push 6s var(--e) both,cam 18s 6s ease-in-out infinite alternate}
@keyframes cam{from{scale:1}to{scale:1.04}}
@keyframes push{from{scale:1.1}to{scale:1}}
.bgl{position:absolute;inset:-6%}
.sc.fall .bgl,.sc.on .bgl,.sc.under .bgl{animation:settle 2.8s var(--e) both}
@keyframes settle{from{scale:1.2}to{scale:1}}
.sc[data-th=dark] .bgl{background:radial-gradient(110% 80% at 50% 115%,#14205c 0%,#0a0e2b 46%,#03040d 86%)}
.sc[data-th=vivid] .bgl{background:linear-gradient(155deg,#0c1458 0%,#34107a 52%,#0a0e2b 100%)}
.sc[data-th=paper] .bgl{background:linear-gradient(180deg,#a9c6ff 0%,#d8e6ff 48%,#f4f8ff 100%)}
.sc[data-k=open] .bgl{background:radial-gradient(60% 50% at 50% 0%,rgba(112,60,200,.38),transparent),radial-gradient(90% 70% at 50% 102%,#1b2a7a 0%,#0a0e2b 50%,#03040d 92%)}
.sc[data-k=fin] .bgl{background:radial-gradient(70% 55% at 50% 100%,rgba(140,70,230,.45),transparent),radial-gradient(110% 80% at 50% 115%,#14205c 0%,#0a0e2b 46%,#03040d 88%)}
.shade{position:absolute;inset:0;z-index:60;background:#02030a;opacity:0;pointer-events:none}
.abs,.pos{position:absolute}
.px{backface-visibility:hidden}

/* reveal system */
.sc:not(.on):not(.out) .rv{opacity:0}
.sc.on .rv{animation:rvIn 1.2s var(--e) calc(var(--b) + var(--i)*.12s) both}
.sc.out .rv{animation:rvOut .55s var(--e) both}
@keyframes rvIn{from{opacity:0;translate:0 calc(var(--u)*2.4*var(--dir))}to{opacity:1;translate:0 0}}
@keyframes rvOut{to{opacity:0;translate:0 calc(var(--u)*-1.6*var(--dir))}}
/* step system: [data-s=n] appears when step >= n, current beat is .cur */
.stp{opacity:0;translate:0 calc(var(--u)*1.6);transition:opacity .8s var(--e),translate 1s var(--e);--b:.1s}
.stp.show{opacity:1;translate:0 0}
.stp.show:not(.cur){opacity:.66}

/* =====================================================================
   4. TEXT COMPONENTS
   ===================================================================== */
.kick{display:flex;align-items:center;gap:calc(var(--u)*1.2);font:600 calc(var(--u)*1.1)/1.7 var(--f-mono);letter-spacing:.26em;text-transform:uppercase;color:var(--ac)}
.kick::before{content:"";flex:none;width:calc(var(--u)*4.2);height:2px;background:currentColor;transform-origin:left;scale:0 1}
.sc.on .kick::before{animation:ln 1.1s var(--e) calc(var(--b) + .15s) both}
@keyframes ln{to{scale:1 1}}
.hl{font:700 calc(var(--u)*5)/1.12 var(--f-ser);color:var(--tx)}
.hl.hv{font-family:var(--f-disp);font-weight:900}
.hline{display:block;padding:.1em 0 .18em;perspective:calc(var(--u)*60)}
.hv .hline{padding:.02em 0 .1em}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;position:relative;color:var(--tx);opacity:0;transform-origin:50% 90%;
  scale:calc(1 + var(--p,0)*.28);text-shadow:0 0 calc(var(--u)*1.4*var(--p,0)) rgba(var(--glow),calc(var(--p,0)*.95))}
.ch::after{content:attr(data-c);position:absolute;left:0;top:0;pointer-events:none;
  background:linear-gradient(100deg,var(--m1) 0%,var(--m2) 38%,var(--m3) 50%,var(--m2) 62%,var(--m1) 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shim 9s linear infinite;animation-delay:calc(var(--c)*-.22s)}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.sc.on .ch{animation:chIn 1.25s var(--e) calc(var(--b) + var(--l,0)*.14s + var(--c)*.03s) both}
.sc.on .ch::after{animation:shim 9s linear infinite;animation-delay:calc(var(--c)*-.22s)}
.sc.out .ch{animation:chOut .5s ease-in calc(var(--c)*.008s) both}
.stp:not(.show) .ch{animation:none!important;opacity:0}
.stp.show .ch{animation:chIn 1.25s var(--e) calc(var(--b) + var(--l,0)*.14s + var(--c)*.03s) both}
@keyframes chIn{from{opacity:0;translate:0 .55em;rotate:x -75deg}to{opacity:1;translate:0 0;rotate:x 0deg}}
@keyframes chOut{to{opacity:0;translate:0 calc(.5em*var(--dir));rotate:x calc(60deg*var(--dir))}}
.pw{display:inline-block;opacity:0;scale:calc(1 + var(--p,0)*.16);text-shadow:0 0 calc(var(--u)*1*var(--p,0)) rgba(var(--glow),calc(var(--p,0)*.9))}
.sc.on .pw{animation:wIn .9s var(--e) calc(var(--b) + var(--w)*.035s) both}
.sc.out .pw{animation:rvOut .4s both}
.stp:not(.show) .pw{animation:none!important;opacity:0}
.stp.show .pw{animation:wIn .9s var(--e) calc(var(--b) + var(--w)*.035s) both}
@keyframes wIn{from{opacity:0;translate:0 .8em}to{opacity:1;translate:0 0}}
.body{font-size:calc(var(--u)*1.6);line-height:1.62;color:var(--tx);text-shadow:0 0 calc(var(--u)*1.2) rgba(3,4,13,.35)}
.sc[data-th=paper] .body{text-shadow:none}

.card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--u)*.9);padding:calc(var(--u)*1) calc(var(--u)*1.5)}
.card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.15),transparent);animation:sweep 8s ease-in-out infinite;animation-delay:calc(var(--i,0)*-1.9s)}
@keyframes sweep{0%,55%{translate:0 0}100%{translate:420% 0}}
.bl{font-size:calc(var(--u)*1.55);line-height:1.55}
.lb{font:600 .8em var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ac);margin-right:.35em}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*1.1)}
.tags{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.7)}
.tag{display:inline-block;padding:.3em .95em;border:1px solid var(--ac);border-radius:99px;font:600 calc(var(--u)*1.05)/1.5 var(--f-mono);color:var(--ac);transition:background .3s,color .3s}
.tag:hover{background:var(--ac);color:var(--bg-deep)}
.sc[data-th=paper] .tag:hover{color:#fff}
.stk{position:absolute;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:calc(var(--u)*1.3);
  font:700 calc(var(--u)*1.05)/1.25 var(--f-disp);color:#fff;z-index:12;
  background:radial-gradient(circle at 30% 25%,var(--hl),var(--ac) 82%);
  box-shadow:0 0 calc(var(--u)*2.2) rgba(var(--glow),.55),inset 0 0 0 calc(var(--u)*.25) rgba(255,255,255,.28);
  rotate:var(--r,-8deg);scale:0;transition:transform .4s var(--pop),box-shadow .4s}
.stk::before{content:"";position:absolute;inset:calc(var(--u)*.55);border:1.5px dashed rgba(255,255,255,.78);border-radius:50%}
.stk:hover{transform:scale(1.1);box-shadow:0 0 calc(var(--u)*3.6) rgba(var(--glow),.9),inset 0 0 0 calc(var(--u)*.25) rgba(255,255,255,.4)}
.sc.on .stk{animation:stamp 1.1s var(--pop) calc(var(--b) + 1.5s + var(--i)*.08s) both,wob 7s ease-in-out calc(var(--b) + 3.2s + var(--i)*.08s) infinite}
.sc.out .stk{animation:none;scale:0}
@keyframes stamp{from{rotate:-120deg;scale:0}to{rotate:var(--r,-8deg);scale:1}}
@keyframes wob{0%,100%{rotate:var(--r,-8deg)}50%{rotate:calc(var(--r,-8deg) + 5deg)}}
/* =====================================================================
   5. SCENE PROPS (motif library)
   ===================================================================== */
.sim{position:absolute;display:block}
.sim.fill{inset:0;width:100%;height:100%}
.stars{position:absolute;inset:0;width:100%;height:100%}
.stars circle{fill:var(--star);opacity:.72}
.stars .tw{animation:twk 4s ease-in-out infinite}
@keyframes twk{50%{opacity:.1}}
.nb{position:absolute;aspect-ratio:1;border-radius:50%;translate:-50% -50%;animation:nbd 40s ease-in-out infinite alternate}
@keyframes nbd{from{transform:translate(-3%,-2%) scale(.94)}to{transform:translate(4%,3%) scale(1.1)}}
@keyframes spin{to{rotate:360deg}}
.rays{position:absolute;left:50%;top:32%;width:150%;aspect-ratio:1;translate:-50% -50%;
  background:repeating-conic-gradient(from 0deg,rgba(var(--glow),.17) 0 3deg,transparent 3deg 13deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:spin 90s linear infinite}
.fog{position:absolute;border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(closest-side,rgba(130,150,255,.24),rgba(130,150,255,.09) 55%,transparent);
  animation:fgx 38s ease-in-out infinite alternate,fgs 17s ease-in-out infinite alternate,fgr 61s linear infinite,fgo 11s ease-in-out infinite alternate}
@keyframes fgx{from{translate:-6% 0}to{translate:6% 3%}}
@keyframes fgs{from{scale:1 1}to{scale:1.18 .86}}
@keyframes fgr{to{rotate:360deg}}
@keyframes fgo{from{opacity:.5}to{opacity:1}}
.ring{position:absolute;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(var(--acc),.4);animation:spin 70s linear infinite}
.ring.rev{animation-direction:reverse}
.ring::after{content:"";position:absolute;top:calc(var(--u)*-.35);left:50%;width:calc(var(--u)*.7);aspect-ratio:1;margin-left:calc(var(--u)*-.35);border-radius:50%;background:var(--hl);box-shadow:0 0 calc(var(--u)*1.2) var(--hl)}
.credit{position:absolute;text-align:center;font:500 calc(var(--u)*1)/1 var(--f-mono);letter-spacing:.34em;text-transform:uppercase;color:var(--txd)}

/* =====================================================================
   6. ARCHETYPES (one block per slide)
   ===================================================================== */
/* --- S1 · A1 Cinematic opener --- */
.tt{text-align:center;font-size:calc(var(--u)*9.4);line-height:1.1}
.ex .ch{font-family:var(--f-disp);font-weight:900;color:#17238a;transform:translateY(var(--ay,0em)) rotate(var(--ar,0deg));
  text-shadow:0 .012em 0 #1d2da8,0 .024em 0 #1a29a0,0 .036em 0 #172598,0 .048em 0 #142190,0 .06em 0 #101c86,0 .072em 0 #0c1778,
    0 .1em .08em rgba(0,0,0,.55),0 0 .5em rgba(var(--glow),.32),0 0 calc(var(--u)*2.2*var(--p,0)) rgba(var(--glow),var(--p,0))}
.ex .ch::after{background-image:linear-gradient(180deg,#fff 0%,#cddcff 45%,#7f9dff 100%);background-size:100% 100%;-webkit-text-stroke:.012em rgba(255,255,255,.5);animation:none!important}
.kick.sc-k{justify-content:center;font:italic 500 calc(var(--u)*2.1)/1.5 var(--f-ser);letter-spacing:.02em;text-transform:none;color:#cdd8ff;clip-path:inset(0 100% 0 0)}
.kick.sc-k::before,.kick.sc-k::after{content:"";width:calc(var(--u)*3.4);height:1px;background:currentColor;opacity:.6;scale:1 1}
.sc.on .kick.sc-k::before{animation:none}
.sc.on .kick.sc-k{animation:wipe 1.8s var(--e) calc(var(--b) + 1.9s) both}
.sc.out .kick.sc-k{animation:none;opacity:0}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.lead{text-align:center;max-width:calc(var(--u)*58);margin:calc(var(--u)*.8) auto 0;font-size:calc(var(--u)*1.75);line-height:1.6;color:var(--tx);
  text-shadow:0 0 calc(var(--u)*1.6) #03040d,0 0 calc(var(--u)*.5) #03040d}

/* --- S2 · roster grid (A7 adapted) --- */
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*1.4)}
.mem{position:relative;display:flex;align-items:center;gap:calc(var(--u)*1.1);padding:calc(var(--u)*1) calc(var(--u)*1.2);min-height:calc(var(--u)*7.6);
  background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--u)*1.1);overflow:hidden;opacity:0;transition:transform .35s var(--pop),border-color .3s,box-shadow .3s}
.mem:hover{transform:translateY(calc(var(--u)*-.5));border-color:var(--hl);box-shadow:0 0 calc(var(--u)*2.4) rgba(var(--glow),.4)}
.sc.on .mem{animation:drop 1.15s linear calc(var(--b) + .6s + var(--i)*.075s) both}
.sc.out .mem{animation:rvOut .4s both}
@keyframes drop{
  0%{opacity:0;translate:0 calc(var(--u)*-14);animation-timing-function:cubic-bezier(.55,.085,.68,.53)}
  14%{opacity:1}
  58%{opacity:1;translate:0 0;animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  76%{translate:0 calc(var(--u)*-1.1);animation-timing-function:cubic-bezier(.55,.085,.68,.53)}
  100%{opacity:1;translate:0 0}}
.av{flex:none;position:relative;width:calc(var(--u)*4.6);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 210deg,var(--ac),var(--hl),var(--ac)) center/cover;box-shadow:0 0 calc(var(--u)*1.2) rgba(var(--glow),.45)}
.av::before{content:"";position:absolute;inset:calc(var(--u)*.22);border-radius:50%;background:var(--bg-mid)}
.av b{position:relative;font:700 calc(var(--u)*1.35)/1 var(--f-disp);color:#fff}
.av.filled::before,.av.filled b{display:none}
.nm{font:600 calc(var(--u)*1.45)/1.3 var(--f-disp);min-width:0}
.ix{position:absolute;right:calc(var(--u)*.8);top:calc(var(--u)*.5);font:500 calc(var(--u)*.85)/1 var(--f-mono);color:var(--txd)}

/* --- S3 · A9 unrolling lab monitor --- */
.mon{position:absolute}
.scr{position:absolute;inset:0;overflow:hidden;border:1px solid var(--line);border-radius:calc(var(--u)*.8);background:#04061a center/cover;
  box-shadow:0 0 calc(var(--u)*5) rgba(var(--glow),.3),inset 0 0 calc(var(--u)*6) rgba(var(--acc),.2);clip-path:inset(49% 0 49% 0 round calc(var(--u)*.8))}
.sc.on .scr{animation:unroll 1.7s var(--e) calc(var(--b) + .35s) both}
@keyframes unroll{to{clip-path:inset(0 0 0 0 round calc(var(--u)*.8))}}
.rail{position:absolute;left:-1.5%;right:-1.5%;height:calc(var(--u)*.7);border-radius:99px;z-index:4;
  background:linear-gradient(90deg,transparent,var(--ac),var(--hl),var(--ac),transparent);box-shadow:0 0 calc(var(--u)*1.2) rgba(var(--glow),.7)}
.rail.t{top:calc(var(--u)*-1.1);translate:0 calc(var(--u)*16.85)}
.rail.b{bottom:calc(var(--u)*-1.1);translate:0 calc(var(--u)*-16.85)}
.sc.on .rail.t{animation:railT 1.7s var(--e) calc(var(--b) + .35s) both}
.sc.on .rail.b{animation:railB 1.7s var(--e) calc(var(--b) + .35s) both}
@keyframes railT{to{translate:0 0}}
@keyframes railB{to{translate:0 0}}
.noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.38}
.slot.filled{background-size:cover;background-position:center}
.slot.filled .noise{opacity:.1}
.dgrid{position:absolute;inset:0;background:linear-gradient(rgba(91,140,255,.12) 1px,transparent 1px) 0 0/calc(var(--u)*3) calc(var(--u)*3),linear-gradient(90deg,rgba(91,140,255,.12) 1px,transparent 1px) 0 0/calc(var(--u)*3) calc(var(--u)*3)}
.scan{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*5);background:linear-gradient(transparent,rgba(120,160,255,.22),transparent);animation:scan 4.5s linear infinite}
@keyframes scan{from{translate:0 -100%}to{translate:0 calc(var(--u)*34)}}
.hud{position:absolute;z-index:3;font:500 calc(var(--u)*.95)/1 var(--f-mono);letter-spacing:.12em;color:rgba(200,214,255,.9);text-transform:uppercase}
.hud.tl{left:calc(var(--u)*1.4);top:calc(var(--u)*1.2)}
.hud.tr{right:calc(var(--u)*1.4);top:calc(var(--u)*1.2);display:flex;align-items:center;gap:.6em}
.hud.bl{left:calc(var(--u)*1.4);bottom:calc(var(--u)*1.2)}
.hud.br{right:calc(var(--u)*1.4);bottom:calc(var(--u)*1.2)}
.rec{width:calc(var(--u)*.8);aspect-ratio:1;border-radius:50%;background:#ff4d6d;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.play{position:absolute;z-index:5;left:50%;top:50%;width:calc(var(--u)*7);aspect-ratio:1;translate:-50% -50%;border-radius:50%;color:#fff;
  border:2px solid rgba(255,255,255,.88);background:radial-gradient(circle at 35% 30%,rgba(var(--glow),.95),rgba(var(--acc),.6));
  box-shadow:0 0 calc(var(--u)*2.5) rgba(var(--glow),.8);display:grid;place-items:center;transition:transform .35s var(--pop),box-shadow .35s}
.play svg{width:42%;height:42%;margin-left:8%}
.play::before{content:"";position:absolute;inset:-14%;border-radius:50%;border:1.5px solid rgba(var(--glow),.85);animation:pr 2.4s ease-out infinite}
@keyframes pr{from{scale:.82;opacity:1}to{scale:1.35;opacity:0}}

/* ======================================================================
   3. LOOP — one rAF drives every running sim
   ====================================================================== */
const loop=new Set();let raf=0;
function tick(t){raf=0;loop.forEach(f=>f(t));if(loop.size)raf=requestAnimationFrame(tick)}
function addLoop(f){loop.add(f);if(!raf)raf=requestAnimationFrame(tick)}
function delLoop(f){loop.delete(f)}

/* ======================================================================
   4. DUST — global glowing particles + burst particles that obey gravity
   ====================================================================== */
const Dust=(()=>{const cv=$('#dust'),x=cv.getContext('2d');let w=0,h=0,d=1,P=[],B=[],col='190,205,255';
  const size=()=>{const r=stage.getBoundingClientRect();d=Math.min(devicePixelRatio||1,1.5);w=cv.width=Math.round(r.width*d);h=cv.height=Math.round(r.height*d)};

    wrap.appendChild(wd);if(wi<ws.length-1){wrap.appendChild(document.createTextNode(' '));ci++}});
  el.appendChild(wrap);
  if(el.dataset.arch){const n=ci,c=(n-1)/2;$$('.ch',wrap).forEach(s=>{const i=+s.style.getPropertyValue('--c');s.style.setProperty('--ar',((i-c)*4).toFixed(2)+'deg');s.style.setProperty('--ay',(((i-c)**2)*.022).toFixed(3)+'em')})}

function build(){SL.forEach((s,i)=>{

function goTo(i,dir,instant){

  dir=dir||(i>cur?1:-1);stage.style.setProperty('--dir',dir);
  const to=SL[i],from=cur>=0?SL[cur]:null,ns=dir>0?0:to.steps;
  busy=true;lockUntil=performance.now()+(instant?250:1600);
  to.el.classList.remove('pre','gone');
  if(!from||instant||RM){                                  /* instant swap (first load, reduced motion, overview jumps) */
    if(from){leaveSlide(from);from.el.classList.remove('on','out','fall','under','top');from.el.classList.add('gone')}
    to.el.classList.add('on');applyStep(to,ns);enterSlide(to);commit(i,dir);busy=false;return}
  if(dir>0){                                               /* FORWARD: the new slide falls from above, lands, bounces */
    to.el.classList.add('fall');applyStep(to,ns);enterSlide(to);from.el.classList.add('out');
    from.el.animate([{scale:1},{scale:.93}],{duration:T1,easing:EG,fill:'forwards'});

    to.el.animate([{translate:'0 -100%'},{translate:'0 0'}],{duration:T1,easing:EG}).onfinish=()=>{

    $('.shade',to.el).animate([{opacity:.75},{opacity:0}],{duration:900,easing:'cubic-bezier(.16,1,.3,1)'});

addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();tx=clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1);ty=clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1);ptr.x=e.clientX;ptr.y=e.clientY;ptr.in=true},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{ptr.in=false;tx=ty=0;resetProx()});
function refreshProx(){const s=SL[cur];if(!s)return;prox=$$('.ch,.pw',s.el).map(e=>{const r=e.getBoundingClientRect();return{e,x:r.left+r.width/2,y:r.top+r.height/2,p:0,R:Math.max(r.height*2.2,stage.clientWidth*.035)}})}
function resetProx(){prox.forEach(it=>{if(it.p){it.e.style.removeProperty('--p');it.p=0}})}
function refreshSoon(){clearTimeout(proxRT);proxRT=setTimeout(refreshProx,1300)}
function pointerFrame(){
  const dx=tx-mx,dy=ty-my;
  if(pxDirty||Math.abs(dx)>.0008||Math.abs(dy)>.0008){pxDirty=false;mx+=dx*.07;my+=dy*.07;const u=stage.clientWidth/100;
    for(const e of PX){const d=+e.dataset.d||0;e.style.transform=`translate3d(${(mx*d*u*.2).toFixed(2)}px,${(my*d*u*.2).toFixed(2)}px,0)`}
    for(const e of TL)e.style.transform=`perspective(${(u*90).toFixed(0)}px) rotateY(${(mx*3.5).toFixed(2)}deg) rotateX(${(-my*2.5).toFixed(2)}deg)`}
  if(proxReady&&ptr.in){for(const it of prox){const d=Math.hypot(ptr.x-it.x,ptr.y-it.y),p=d<it.R?Math.pow(1-d/it.R,2):0;
    if(Math.abs(p-it.p)>.03||(p===0&&it.p!==0)){it.p=p;it.e.style.setProperty('--p',p.toFixed(2))}}}}

/* ======================================================================
   9. INPUT — wheel (one flick = one beat), touch, keys, deep link
   ====================================================================== */
const ovEl=$('#ov'),lbEl=$('#lb'),isEdit=()=>document.body.classList.contains('edit');
const blocked=()=>ovEl.classList.contains('open')||lbEl.classList.contains('open')||isEdit();
let acc=0,accT=0,quiet=0;
addEventListener('wheel',e=>{
  if(e.target.closest&&e.target.closest('#ed,#ov'))return;          /* let panels scroll natively */
  e.preventDefault();if(blocked())return;
  const now=performance.now();
  if(now<lockUntil||now<quiet||busy){quiet=now+170;return}          /* swallow inertia, extend the quiet window */
  acc+=e.deltaY;clearTimeout(accT);accT=setTimeout(()=>acc=0,140);
  if(Math.abs(acc)>55){const d=acc>0?1:-1;acc=0;quiet=now+170;next(d)}
},{passive:false,capture:true});
let t0=null;
addEventListener('touchstart',e=>{if(blocked()||(e.target.closest&&e.target.closest('#ed')))return;t0={y:e.touches[0].clientY,x:e.touches[0].clientX}},{passive:true});
addEventListener('touchend',e=>{if(!t0)return;const dy=t0.y-e.changedTouches[0].clientY,dx=t0.x-e.changedTouches[0].clientX;t0=null;const m=Math.abs(dy)>=Math.abs(dx)?dy:dx;if(Math.abs(m)>50)next(m>0?1:-1)},{passive:true});
function jump(i){if(busy||performance.now()<lockUntil)return;goTo(clamp(i,0,SLN-1))}
const fromHash=()=>{const m=/slide-(\d+)/.exec(location.hash);return m?clamp(+m[1]-1,0,SLN-1):0};
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)jump(i)});
function fs(){try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('textarea,input')){if(e.key==='Escape')e.target.blur();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='Escape'){closeAll();return}
  if(k==='s'||k==='S'){toggleEd();return}
  if(k==='g'||k==='G'){toggleOv();return}
  if(k==='f'||k==='F'){fs();return}
  if(blocked())return;
  if(e.target.closest&&e.target.closest('button')&&(k===' '||k==='Enter'))return;
  if(['ArrowDown','ArrowRight','PageDown',' '].includes(k)){e.preventDefault();next(1)}
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(k)){e.preventDefault();next(-1)}
  else if(k==='Home'){e.preventDefault();jump(0)}else if(k==='End'){e.preventDefault();jump(SLN-1)}
});

/* ======================================================================
   10. OVERVIEW GRID (G)
   ====================================================================== */
function buildOv(){$('#ovg').innerHTML=SL.map((s,i)=>`<button class="th t-${s.el.dataset.th}" style="--i:${i}" data-i="${i}" aria-label="Slide ${i+1}: ${s.name}"><b>${pad(i+1)}</b><span>${s.name}</span></button>`).join('');
  $$('.th',ovEl).forEach(b=>b.addEventListener('click',()=>{closeOv();const i=+b.dataset.i;setTimeout(()=>jump(i),80)}))}
function toggleOv(){if(isEdit()||lbEl.classList.contains('open'))return;if(ovEl.classList.contains('open'))return closeOv();
  $$('.th',ovEl).forEach((b,i)=>b.classList.toggle('cur',i===cur));ovEl.classList.add('open');const c=$('.th.cur',ovEl);if(c)c.focus()}
function closeOv(){ovEl.classList.remove('open')}
ovEl.addEventListener('click',e=>{if(e.target===ovEl)closeOv()});
function closeAll(){closeOv();closeVideo();if(isEdit())toggleEd(false)}

/* ======================================================================
   11. VIDEO LIGHTBOX (placeholder now, real video via VIDEO_SRC later)
   ====================================================================== */
function openVideo(){const b=$('#lbb');b.innerHTML='';
  if(VIDEO_SRC){const v=/\.(mp4|webm|ogv|mov)(\?|$)/i.test(VIDEO_SRC),n=document.createElement(v?'video':'iframe');n.src=VIDEO_SRC;
    if(v){n.controls=true;n.autoplay=true;n.playsInline=true}else{n.allow='autoplay; fullscreen';n.allowFullscreen=true;n.title='Video thí nghiệm'}b.appendChild(n)}
  else{b.innerHTML='<div class="lbph"><canvas width="192" height="108"></canvas><span>Video thí nghiệm sẽ được chèn tại đây.<br>Mở file HTML, tìm hằng số <b>VIDEO_SRC</b> và dán đường dẫn video vào.</span></div>';
    const c=$('canvas',b).getContext('2d'),im=c.createImageData(192,108);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=v*.55;im.data[i+1]=v*.7;im.data[i+2]=v;im.data[i+3]=255}c.putImageData(im,0,0)}
  lbEl.classList.add('open');$('#lbx').focus()}
function closeVideo(){lbEl.classList.remove('open');$('#lbb').innerHTML=''}
$('#lbx').addEventListener('click',closeVideo);lbEl.addEventListener('click',e=>{if(e.target===lbEl)closeVideo()});
document.addEventListener('click',e=>{if(!isEdit()&&e.target.closest&&e.target.closest('.play'))openVideo()});

/* ======================================================================
   12. EDITOR MODE (S) — edit any text, swap any image slot, export the file
   ====================================================================== */
const LS='su-roi-tu-do:'+location.pathname;
let EDITS={text:{},img:{}};
(function(){let st=null;try{st=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  const base=window.__EDITS||{};EDITS={text:Object.assign({},base.text,st&&st.text),img:Object.assign({},base.img,st&&st.img)}})();
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(EDITS));return true}catch(e){return false}};
const say=t=>{const m=$('#edmsg');m.textContent=t;clearTimeout(say._t);say._t=setTimeout(()=>{m.textContent=''},3400)};
const edEls=s=>$$('[data-ed]',s.el);
const fillSlot=(e,d)=>{e.style.backgroundImage=`url(${d})`;e.classList.add('filled')};
const clearSlot=e=>{e.style.backgroundImage='';e.classList.remove('filled')};
function applyEdits(){SL.forEach((s,i)=>{edEls(s).forEach(e=>{const k=i+'|'+e.dataset.ed;if(EDITS.text[k]!=null)applyText(e,EDITS.text[k])});
  $$('[data-slot]',s.el).forEach(e=>{const d=EDITS.img[e.dataset.slot];if(d)fillSlot(e,d)})})}
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function buildEd(){const s=SL[cur],body=$('#edbody');$('#edt').textContent=`${pad(cur+1)} · ${s.name}`;
  const seen=new Set();let h='<h4>Văn bản trên slide này</h4>';
  edEls(s).forEach(e=>{const l=e.dataset.ed;if(seen.has(l))return;seen.add(l);const v=rawText(e);
    h+=`<label class="f" for="ef-${seen.size}">${esc(l)}</label><textarea id="ef-${seen.size}" rows="${clamp(Math.ceil(v.length/34),1,5)}" data-l="${esc(l)}">${esc(v)}</textarea>`});
  const sl=$$('[data-slot]',s.el);
  if(sl.length){h+='<h4>Hình ảnh</h4>';sl.forEach(e=>{const k=e.dataset.slot;h+=`<div class="edrow"><span>${k}</span><label class="btn">Thay ảnh<input type="file" accept="image/*" data-slot="${k}"></label><button data-rs="${k}">Khôi phục</button></div>`})}
  body.innerHTML=h;
  $$('textarea',body).forEach(t=>t.addEventListener('input',()=>{const el=edEls(s).find(e=>e.dataset.ed===t.dataset.l);if(!el)return;
    EDITS.text[cur+'|'+t.dataset.l]=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{applyText(el,t.value);persist();refreshSoon()},250)}));
  $$('input[type=file]',body).forEach(f=>f.addEventListener('change',()=>pickImg(f)));
  $$('[data-rs]',body).forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.rs,e=$(`[data-slot="${k}"]`,s.el);delete EDITS.img[k];if(e)clearSlot(e);persist()}))}
function pickImg(f){const file=f.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1920/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.88),key=f.dataset.slot,e=$(`[data-slot="${key}"]`,SL[cur].el);
    EDITS.img[key]=d;if(e)fillSlot(e,d);if(!persist())say('Ảnh quá lớn cho bộ nhớ trình duyệt — hãy bấm "Lưu HTML" để giữ lại.')};im.src=rd.result};rd.readAsDataURL(file)}
function toggleEd(force){const on=force!=null?force:!isEdit();
  if(on){closeOv();document.body.classList.add('edit');buildEd()}else{document.body.classList.remove('edit');$$('.ed-hl').forEach(x=>x.classList.remove('ed-hl'))}}
document.addEventListener('click',e=>{if(!isEdit())return;const t=e.target.closest&&e.target.closest('[data-ed]');if(!t||!SL[cur].el.contains(t))return;
  e.preventDefault();e.stopPropagation();$$('.ed-hl').forEach(x=>x.classList.remove('ed-hl'));t.classList.add('ed-hl');
  const ta=$$('#edbody textarea').find(x=>x.dataset.l===t.dataset.ed);if(ta){ta.focus();ta.scrollIntoView({block:'center'})}},true);
const edGo=d=>{const i=cur+d;if(i<0||i>=SLN||busy)return;goTo(i,d);const w=()=>busy?setTimeout(w,200):buildEd();setTimeout(w,300)};
$('#edb').addEventListener('click',()=>toggleEd(true));$('#edx').addEventListener('click',()=>toggleEd(false));
$('#edp').addEventListener('click',()=>edGo(-1));$('#edn').addEventListener('click',()=>edGo(1));
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
$('#edsave').addEventListener('click',()=>{const j=JSON.stringify(EDITS).replace(/</g,'\\u003c');
  const out=SRC.replace(/<script id="__edits">[\s\S]*?<\/script>/,()=>'<script id="__edits">window.__EDITS='+j+';<\/script>');
  dl('su-roi-tu-do.html',out,'text/html');say('Đã xuất file HTML kèm các chỉnh sửa.')});
$('#edbk').addEventListener('click',()=>{dl('su-roi-tu-do-backup.json',JSON.stringify(EDITS,null,1),'application/json');say('Đã tạo file sao lưu .json.')});
$('#edld').addEventListener('click',()=>$('#edldf').click());
$('#edldf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const j=JSON.parse(t);EDITS={text:j.text||{},img:j.img||{}};applyEdits();persist();buildEd();say('Đã nạp bản sao lưu.')}catch(err){say('File sao lưu không hợp lệ.')}});e.target.value=''});
function restoreSlide(i){const s=SL[i];edEls(s).forEach(e=>{if(e.dataset.o!=null)applyText(e,e.dataset.o)});
  Object.keys(EDITS.text).forEach(k=>{if(k.startsWith(i+'|'))delete EDITS.text[k]});$$('[data-slot]',s.el).forEach(e=>{delete EDITS.img[e.dataset.slot];clearSlot(e)})}
$('#edrs').addEventListener('click',()=>{restoreSlide(cur);persist();buildEd();refreshSoon();say('Đã khôi phục slide này.')});
$('#edra').addEventListener('click',()=>{if(!confirm('Khôi phục toàn bộ nội dung gốc của cả bài thuyết trình?'))return;SL.forEach((s,i)=>restoreSlide(i));EDITS={text:{},img:{}};persist();buildEd();refreshSoon();say('Đã khôi phục tất cả.')});

/* ======================================================================
   13. INIT
   ====================================================================== */
build();Dust.init();buildOv();applyEdits();
stage.style.touchAction='none';
if(RM){$('#dust').style.display='none'}else{addLoop(Dust.draw);addLoop(pointerFrame)}
goTo(fromHash(),1,true);
setTimeout(warm,300);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setTimeout(refreshProx,200)});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{Dust.size();SL.forEach(s=>{const c=s.el.classList;if(c.contains('on')||c.contains('pre'))s.sims.forEach(x=>x.size())});refreshProx()},150)});
})();
</script>
</body>
</html>
