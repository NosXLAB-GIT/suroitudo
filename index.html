<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SỰ RƠI TRONG KHÔNG KHÍ — Từ Triết Học Cổ Đại Đến Cơ Học Cổ Điển</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060913">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500;1,600&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600;1,700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
/* ===================================================================
   1. TOKENS
   =================================================================== */
:root{
  --bg-deep:#060913;
  --brass:#d4af37; --brass-light:#f6e082; --brass-dark:#a07a10;
  --brass-glow:rgba(212,175,55,0.42);
  --cyan:#38bdf8; --cyan-glow:rgba(56,189,248,0.5);
  --text-main:#f8fafc;
  --border-glass:rgba(212,175,55,0.3);
  --u:min(1vw,1.7778vh);
  --e:cubic-bezier(0.16,1,0.3,1);
  --pop:cubic-bezier(0.34,1.56,0.64,1);
  --g:cubic-bezier(0.55,0.085,0.68,0.53);
  /* Fonts: all three support Vietnamese stacked diacritics */
  --f-head:'Oswald','Be Vietnam Pro',system-ui,sans-serif;
  --f-ser:'Playfair Display',Georgia,serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#02040b}
body{display:grid;place-items:center;font-family:var(--f-body);color:var(--text-main);overscroll-behavior:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 16:9 stage */
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:var(--bg-deep);font-size:calc(var(--u)*1.55);line-height:1.6;isolation:isolate}
#deck{position:absolute;inset:0;z-index:1}

/* ===================================================================
   2. SLIDE LIFECYCLE & BACKGROUNDS
   =================================================================== */
.sc{position:absolute;inset:0;display:none;z-index:1;overflow:hidden}
.sc.on{display:block;z-index:2}
.sc:not(.on) *{animation-play-state:paused!important}
.bgl{position:absolute;inset:-8%;
  background:radial-gradient(ellipse at 75% 15%,rgba(212,175,55,0.16),transparent 50%),
             radial-gradient(ellipse at 15% 85%,rgba(56,189,248,0.12),transparent 50%),
             linear-gradient(145deg,#040711,#0a1020 50%,#030609)}
.sc[data-th="parchment"] .bgl{background:radial-gradient(ellipse at 65% 25%,rgba(217,119,6,0.2),transparent 55%),radial-gradient(ellipse at 20% 80%,rgba(99,102,241,0.1),transparent 45%),linear-gradient(135deg,#06090f,#0e1428 55%,#060a10)}
.sc[data-th="vacuum"] .bgl{background:radial-gradient(ellipse at 50% 40%,rgba(56,189,248,0.2),transparent 60%),radial-gradient(ellipse at 90% 85%,rgba(14,165,233,0.14),transparent 45%),linear-gradient(170deg,#02040b,#06112a 55%,#020409)}
.sc[data-th="finale"] .bgl{background:radial-gradient(ellipse at 50% 45%,rgba(212,175,55,0.24),transparent 55%),radial-gradient(ellipse at 15% 20%,rgba(56,189,248,0.14),transparent 50%),linear-gradient(145deg,#050810,#0c1225 55%,#040710)}
.sc.on .bgl{animation:bgSettle 2.6s var(--e) both}
@keyframes bgSettle{from{scale:1.15}to{scale:1}}
.cam{position:absolute;inset:0}
.sc.on .cam{animation:camDolly 24s ease-in-out infinite alternate}
@keyframes camDolly{from{scale:1}to{scale:1.02}}

/* Reveal */
.sc:not(.on) .rv{opacity:0}
.sc.on .rv{animation:rvIn 1.1s var(--e) calc(0.1s + var(--i,0) * 0.12s) both}
@keyframes rvIn{from{opacity:0;transform:translateY(calc(var(--u) * 2.4))}to{opacity:1;transform:translateY(0)}}

/* ===================================================================
   3. TYPOGRAPHY — BIG & BOLD
   =================================================================== */
.slide-head{position:absolute;left:calc(var(--u)*7);right:calc(var(--u)*14);top:calc(var(--u)*2.7);z-index:6}
.kicker{display:flex;align-items:center;gap:calc(var(--u)*1.2);font:700 calc(var(--u)*1.3)/1.4 var(--f-body);letter-spacing:0.18em;text-transform:uppercase;color:var(--brass-light);text-shadow:0 0 calc(var(--u)*1.2) var(--brass-glow);white-space:nowrap}
.kicker::before{content:"";width:calc(var(--u)*3.6);height:2px;background:currentColor;flex-shrink:0}
.headline{font-family:var(--f-head);font-weight:700;font-size:calc(var(--u)*5);line-height:1.15;text-transform:uppercase;letter-spacing:0.01em;margin-top:calc(var(--u)*0.3);color:#fff}
.fit{display:block;white-space:nowrap}
.hline{display:block;perspective:1000px;padding:0.08em 0 0.06em}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;position:relative;color:inherit;opacity:0;transform-origin:50% 90%}
.sc.on .ch{animation:chFlip 1.1s var(--e) calc(0.15s + var(--l,0) * 0.14s + var(--c,0) * 0.022s) both}
@keyframes chFlip{from{opacity:0;transform:translateY(0.5em) rotateX(-70deg)}to{opacity:1;transform:none}}
.ch::after{content:attr(data-c);position:absolute;left:0;top:0;pointer-events:none;
  background:linear-gradient(118deg,transparent 0%,transparent 38%,rgba(255,255,255,0.9) 47%,var(--brass-light) 56%,transparent 68%,transparent 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:goldSweep 8s linear infinite;animation-delay:calc(var(--c,0) * -0.2s)}
@keyframes goldSweep{0%{background-position:150% 0}100%{background-position:-150% 0}}
.pw{display:inline-block;opacity:0}
.sc.on .pw{animation:wordIn 0.8s var(--e) calc(0.35s + var(--w,0) * 0.025s) both}
@keyframes wordIn{from{opacity:0;transform:translateY(0.55em)}to{opacity:1;transform:none}}

.content{position:absolute;left:calc(var(--u)*7);right:calc(var(--u)*7);top:calc(var(--u)*12.6);bottom:calc(var(--u)*5)}
.grid2{display:grid;gap:calc(var(--u)*3);align-items:center;height:100%}

/* Cards */
.glass-card{background:linear-gradient(145deg,rgba(14,22,46,0.9),rgba(8,14,30,0.94));border:1px solid var(--border-glass);border-radius:calc(var(--u)*1.3);padding:calc(var(--u)*1.8) calc(var(--u)*2.2);box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*4.5) rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.07);position:relative;overflow:hidden}
.glass-card::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,0.08),transparent);animation:glassSweep 11s ease-in-out infinite;pointer-events:none}
@keyframes glassSweep{0%,55%{transform:translateX(0)}100%{transform:translateX(360%)}}
.card-kicker{font:800 calc(var(--u)*1.15)/1.3 var(--f-body);letter-spacing:0.16em;text-transform:uppercase;color:var(--brass)}
.card-title{font-family:var(--f-ser);font-weight:800;font-size:calc(var(--u)*2.5);line-height:1.25;color:var(--brass-light);margin:calc(var(--u)*0.6) 0 calc(var(--u)*1)}
.txt{font-size:calc(var(--u)*1.55);line-height:1.65;color:#eef2f7}
.txt b{color:#fff}
.txt em{color:var(--brass-light);font-style:normal;font-weight:700}
.note-box{padding:calc(var(--u)*1) calc(var(--u)*1.3);border-left:4px solid var(--brass);background:rgba(212,175,55,0.13);border-radius:6px;font-size:calc(var(--u)*1.38);line-height:1.6;color:#f1f5f9}
.note-box.cyan{border-color:var(--cyan);background:rgba(56,189,248,0.12)}
.note-box.red{border-color:#ef4444;background:rgba(239,68,68,0.12)}

/* Media frame */
.media-frame{position:relative;border-radius:calc(var(--u)*1);overflow:hidden;border:1.5px solid rgba(212,175,55,0.35);background:#000;box-shadow:0 calc(var(--u)*1.6) calc(var(--u)*4) rgba(0,0,0,0.65);transition:transform 0.4s var(--pop),border-color 0.4s;cursor:pointer}
.media-frame:hover{transform:translateY(calc(var(--u)*-0.6)) scale(1.02);border-color:var(--brass-light)}
.media-frame img{width:100%;height:100%;object-fit:cover;display:block}
.media-caption{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--u)*0.7) calc(var(--u)*1.1);background:linear-gradient(0deg,rgba(4,7,18,0.95),rgba(4,7,18,0.6) 65%,transparent);font:600 calc(var(--u)*1.0) var(--f-body);color:#e2e8f0;display:flex;justify-content:space-between}
.zoom-hint{font-size:calc(var(--u)*0.85);color:var(--brass);background:rgba(212,175,55,0.18);padding:1px 7px;border-radius:3px}
.gold-badge{display:inline-flex;align-items:center;gap:calc(var(--u)*0.7);padding:calc(var(--u)*0.75) calc(var(--u)*1.9);border-radius:99px;font:800 calc(var(--u)*1.25)/1.2 var(--f-body);color:#fff;background:linear-gradient(135deg,#8b5e08,var(--brass),#8b5e08);box-shadow:0 calc(var(--u)*0.7) calc(var(--u)*2) rgba(140,90,10,0.55),inset 0 1px 0 rgba(255,255,255,0.4);letter-spacing:0.05em;text-transform:uppercase}
.gold-badge.cyan{background:rgba(56,189,248,0.2);border:1.5px solid var(--cyan);color:#bae6fd;box-shadow:0 0 calc(var(--u)*1.8) var(--cyan-glow)}

/* ===================================================================
   4. ANIMATED MOTIFS (SVG scenes, rulers, astrolabe)
   =================================================================== */
/* Top-right astrolabe ornament */
.orn{position:absolute;right:calc(var(--u)*4);top:calc(var(--u)*2.6);width:calc(var(--u)*8.2);aspect-ratio:1;z-index:7;filter:drop-shadow(0 0 calc(var(--u)*1.2) var(--brass-glow))}
.orn svg{width:100%;height:100%;display:block}
.astro-spin{transform-origin:50px 50px;animation:spin 40s linear infinite}
.astro-rev{transform-origin:50px 50px;animation:spin 22s linear infinite reverse}
.astro-orbit{transform-origin:50px 50px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pisa tower scene */
.scene{position:absolute;z-index:4}
.scene svg{width:100%;height:100%;display:block;overflow:visible}
.pisa-ball{animation:pisaDrop 3.4s infinite}
@keyframes pisaDrop{
  0%,14%{transform:translateY(0);opacity:1;animation-timing-function:cubic-bezier(.5,0,1,.6)}
  52%{transform:translateY(267px);animation-timing-function:ease-out}
  56%{transform:translateY(261px);animation-timing-function:ease-in}
  60%{transform:translateY(267px)}
  88%{transform:translateY(267px);opacity:1}
  100%{transform:translateY(267px);opacity:0}}
.pisa-impact{transform-box:fill-box;transform-origin:center;animation:impactPulse 3.4s infinite}
@keyframes impactPulse{0%,50%{opacity:0;transform:scale(.3)}54%{opacity:1;transform:scale(1)}82%,100%{opacity:0;transform:scale(2.4)}}

/* Newton tube scene */
.tube-fast{animation:tubeFast 4.6s infinite}
.tube-slow{animation:tubeSlow 4.6s infinite}
@keyframes tubeFast{
  0%,8%{transform:translateY(0);opacity:1;animation-timing-function:cubic-bezier(.5,0,1,.6)}
  38%{transform:translateY(280px)}
  88%{transform:translateY(280px);opacity:1}
  100%{transform:translateY(280px);opacity:0}}
@keyframes tubeSlow{
  0%,8%{transform:translateY(0);opacity:1;animation-timing-function:cubic-bezier(.3,.1,.6,1)}
  90%{transform:translateY(270px);opacity:1}
  100%{transform:translateY(270px);opacity:0}}
.sway{transform-box:fill-box;transform-origin:center;animation:svgSway 1s ease-in-out infinite alternate}
@keyframes svgSway{from{transform:translateX(-8px) rotate(-30deg)}to{transform:translateX(8px) rotate(30deg)}}
.tube-impact{transform-box:fill-box;transform-origin:center;animation:tubeImpact 4.6s infinite}
@keyframes tubeImpact{0%,36%{opacity:0;transform:scaleX(.3)}40%{opacity:1;transform:scaleX(1)}62%,100%{opacity:0;transform:scaleX(1.6)}}
.air-dot{animation:airDrift 5s ease-in-out infinite alternate}
@keyframes airDrift{from{transform:translate(-4px,6px)}to{transform:translate(4px,-6px)}}

/* Drop rulers (stone vs feather falling along a measuring ruler) */
.drop-ruler{position:absolute;width:calc(var(--u)*3.6);z-index:4}
.dr-track{position:absolute;inset:0;border:1.5px solid rgba(212,175,55,0.45);border-radius:calc(var(--u)*0.6);overflow:hidden;
  background:repeating-linear-gradient(180deg,rgba(212,175,55,0.55) 0 1px,transparent 1px calc(var(--u)*1.2)) left/30% 100% no-repeat,
             repeating-linear-gradient(180deg,rgba(212,175,55,0.35) 0 1px,transparent 1px calc(var(--u)*1.2)) right/30% 100% no-repeat,
             rgba(10,16,36,0.6);box-shadow:0 0 calc(var(--u)*2) rgba(212,175,55,0.15)}
.drop-ruler.vac .dr-track{border-color:rgba(56,189,248,0.55);box-shadow:0 0 calc(var(--u)*2) rgba(56,189,248,0.2)}
.dr-label{position:absolute;top:0;left:100%;margin-left:calc(var(--u)*0.6);writing-mode:vertical-rl;font:800 calc(var(--u)*1.05) var(--f-body);letter-spacing:0.25em;color:var(--brass-light);white-space:nowrap}
.drop-ruler.flip .dr-label{left:auto;right:100%;margin:0 calc(var(--u)*0.6) 0 0}
.drop-ruler.vac .dr-label{color:#7dd3fc}
.dr-fall{position:absolute;left:0;right:0;top:0;height:100%;transform:translateY(-100%)}
.dr-fall.fast{animation:drFast 4.8s infinite}
.dr-fall.slow{animation:drSlow 4.8s infinite}
@keyframes drFast{0%,10%{transform:translateY(-100%);opacity:1;animation-timing-function:cubic-bezier(.5,0,1,.6)}42%{transform:translateY(0)}86%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes drSlow{0%,10%{transform:translateY(-100%);opacity:1;animation-timing-function:cubic-bezier(.3,.1,.6,1)}92%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.dr-stone{position:absolute;bottom:2px;left:18%;width:calc(var(--u)*1.3);height:calc(var(--u)*1.2);border-radius:45% 55% 40% 60%;background:radial-gradient(circle at 35% 30%,#94a3b8,#334155);box-shadow:0 0 calc(var(--u)*0.6) rgba(56,189,248,0.6)}
.dr-feather{position:absolute;bottom:0;left:52%;width:calc(var(--u)*1.2);animation:htmlSway 1s ease-in-out infinite alternate}
.dr-feather svg{width:100%;display:block}
@keyframes htmlSway{from{transform:translateX(calc(var(--u)*-0.5)) rotate(-28deg)}to{transform:translateX(calc(var(--u)*0.3)) rotate(28deg)}}
.drop-ruler.vac .dr-feather{animation:none}

/* Hero (welcome / thank you) */
.hero-center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:calc(var(--u)*58);text-align:center;display:flex;flex-direction:column;align-items:center;z-index:5}
.hero-center .kicker{justify-content:center;font-size:calc(var(--u)*1.35)}
.hero-center .kicker::before{display:none}
.hero-title{font-family:var(--f-ser);font-weight:900;font-size:calc(var(--u)*6.8);line-height:1.1;width:100%;margin-top:calc(var(--u)*1)}
.hero-title .l1{color:#fff8e1;text-shadow:0 calc(var(--u)*0.4) calc(var(--u)*2.5) rgba(212,175,55,0.5)}
.hero-title .l2{color:var(--brass-light);text-shadow:0 0 calc(var(--u)*2.5) rgba(212,175,55,0.45)}
.hero-sub{font-family:var(--f-ser);font-style:italic;font-weight:700;font-size:calc(var(--u)*2.3);color:#e0f2fe;margin-top:calc(var(--u)*0.4)}
.hero-lead{font-size:calc(var(--u)*1.7);line-height:1.6;font-weight:500;color:#f1f5f9;margin-top:calc(var(--u)*1.2);text-shadow:0 2px 10px rgba(0,0,0,0.8)}
.opener-rays{position:absolute;left:50%;top:44%;width:calc(var(--u)*130);height:calc(var(--u)*130);transform:translate(-50%,-50%);pointer-events:none;z-index:1;background:repeating-conic-gradient(from 0deg,rgba(212,175,55,0.08) 0deg 4deg,transparent 4deg 15deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 65%);mask-image:radial-gradient(circle,#000,transparent 65%);animation:spinC 120s linear infinite}
@keyframes spinC{to{transform:translate(-50%,-50%) rotate(360deg)}}
.grid-floor{position:absolute;left:-10%;right:-10%;bottom:calc(var(--u)*3);height:calc(var(--u)*16);pointer-events:none;z-index:1;background:repeating-linear-gradient(90deg,rgba(212,175,55,0.14) 0 1px,transparent 1px calc(var(--u)*5)),repeating-linear-gradient(0deg,rgba(56,189,248,0.12) 0 1px,transparent 1px calc(var(--u)*2.5));transform:perspective(calc(var(--u)*35)) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(0deg,#000 20%,transparent);mask-image:linear-gradient(0deg,#000 20%,transparent)}
.ring{position:absolute;left:50%;top:46%;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);z-index:1}
.ring.r1{width:calc(var(--u)*76);height:calc(var(--u)*76);border:1.5px dashed rgba(212,175,55,0.26);animation:spinC 110s linear infinite}
.ring.r2{width:calc(var(--u)*56);height:calc(var(--u)*56);border:1.5px solid rgba(56,189,248,0.18);animation:spinC 70s linear infinite reverse}
.ring.r3{width:calc(var(--u)*40);height:calc(var(--u)*40);border:1px dashed rgba(212,175,55,0.2);animation:spinC 45s linear infinite}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.2);width:100%;margin-top:calc(var(--u)*1.8)}
.pillar{background:linear-gradient(145deg,rgba(14,22,46,0.92),rgba(8,13,28,0.96));border:1px solid rgba(212,175,55,0.38);border-radius:calc(var(--u)*0.9);padding:calc(var(--u)*0.9) calc(var(--u)*1);display:flex;align-items:center;gap:calc(var(--u)*0.9);text-align:left;cursor:pointer;transition:transform 0.35s var(--pop),border-color 0.35s}
.pillar:hover{transform:translateY(calc(var(--u)*-0.45)) scale(1.03);border-color:var(--brass-light)}
.pillar-num{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:50%;background:linear-gradient(135deg,var(--brass-dark),var(--brass));display:grid;place-items:center;flex-shrink:0;font:900 calc(var(--u)*1.25) var(--f-ser);color:#fff;box-shadow:0 0 calc(var(--u)*1.2) var(--brass-glow)}
.pillar b{display:block;font:800 calc(var(--u)*1.3)/1.25 var(--f-body);color:var(--brass-light)}
.pillar span{display:block;font-size:calc(var(--u)*1.0);color:#cbd5e1;line-height:1.35}
.members-strip{position:absolute;bottom:0;left:0;right:0;padding:calc(var(--u)*0.8) 0;background:linear-gradient(90deg,transparent,rgba(6,9,19,0.94) 10%,rgba(6,9,19,0.94) 90%,transparent);border-top:1px solid rgba(212,175,55,0.25);overflow:hidden;z-index:10}
.members-strip-inner{display:flex;gap:calc(var(--u)*3.5);width:max-content;animation:marquee 32s linear infinite;white-space:nowrap}
.members-strip-inner span{font:700 calc(var(--u)*1.3) var(--f-body);color:rgba(248,250,252,0.9)}
.members-strip-inner span::before{content:"◈ ";color:var(--brass)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Members slide */
.members-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*1.4);height:100%}
.member-card{background:linear-gradient(145deg,rgba(14,22,46,0.92),rgba(8,13,28,0.96));border:1px solid rgba(212,175,55,0.3);border-radius:calc(var(--u)*1);padding:calc(var(--u)*1) calc(var(--u)*1.2);display:flex;align-items:center;gap:calc(var(--u)*1.2);box-shadow:0 calc(var(--u)*0.8) calc(var(--u)*2.5) rgba(0,0,0,0.5);transition:transform 0.35s var(--pop),border-color 0.35s;opacity:0}
.sc.on .member-card{animation:cardIn 0.7s var(--pop) calc(0.4s + var(--mi,0) * 0.07s) both}
@keyframes cardIn{0%{opacity:0;transform:scale(0.7) translateY(calc(var(--u)*1.5))}100%{opacity:1;transform:none}}
.member-card:hover{transform:translateY(calc(var(--u)*-0.5)) scale(1.04);border-color:var(--brass)}
.member-avatar{position:relative;width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--brass-dark),var(--brass),var(--brass-light));display:grid;place-items:center;font:900 calc(var(--u)*2) var(--f-ser);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5);box-shadow:0 0 calc(var(--u)*1.5) var(--brass-glow)}
.member-avatar::before{content:"";position:absolute;inset:calc(var(--u)*-0.5);border-radius:50%;border:1.5px dashed rgba(56,189,248,0.7);animation:spin 9s linear infinite}
.member-num{font:800 calc(var(--u)*0.95) var(--f-body);color:var(--brass);letter-spacing:0.12em}
.member-name{font:800 calc(var(--u)*1.6)/1.25 var(--f-body);color:#fff}

/* Cinema (video slides) */
.cinema-box{position:relative;height:100%;aspect-ratio:16/9;margin:0 auto;border-radius:calc(var(--u)*1.2);overflow:hidden;border:2px solid var(--brass);background:#000;box-shadow:0 0 calc(var(--u)*5) var(--brass-glow),0 calc(var(--u)*3) calc(var(--u)*9) rgba(0,0,0,0.9)}
.cinema-box video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.rec-badge{position:absolute;top:calc(var(--u)*1);left:calc(var(--u)*1.3);display:flex;align-items:center;gap:calc(var(--u)*0.7);font:700 calc(var(--u)*0.95) var(--f-body);color:var(--brass-light);background:rgba(4,7,18,0.85);padding:calc(var(--u)*0.35) calc(var(--u)*1);border-radius:99px;border:1px solid var(--border-glass);z-index:5;pointer-events:none}
.rec-dot{width:calc(var(--u)*0.7);aspect-ratio:1;border-radius:50%;background:#ef4444;animation:recPulse 1.3s ease-in-out infinite}
@keyframes recPulse{50%{opacity:0.15}}

/* Parchment */
.parchment-sheet{background:linear-gradient(148deg,#fdf9ef,#f5ecda 60%,#ede0c4);border:1px solid #c9b98a;border-radius:calc(var(--u)*1.1);padding:calc(var(--u)*2.2);color:#1c1917;box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,0.5),inset 0 0 calc(var(--u)*3) rgba(205,185,138,0.35);position:relative;overflow:hidden}

/* Timeline rows (Mở đầu) */
.milestone{display:flex;align-items:center;gap:calc(var(--u)*1.3);padding:calc(var(--u)*1.1) calc(var(--u)*1.3);border-radius:calc(var(--u)*0.8)}
.milestone .num{font:900 calc(var(--u)*2.8) var(--f-ser);line-height:1}
.milestone b{display:block;font:800 calc(var(--u)*1.5)/1.3 var(--f-body)}
.milestone span{display:block;font-size:calc(var(--u)*1.25);color:#dbe3ee;line-height:1.5}

/* Tribute (Kết luận) */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.1);margin-top:calc(var(--u)*1)}
.tri div{padding:calc(var(--u)*1) calc(var(--u)*1.1);background:rgba(10,18,42,0.8);border:1px solid var(--border-glass);border-radius:calc(var(--u)*0.8);text-align:center}
.tri b{display:block;font:700 calc(var(--u)*1.5) var(--f-head);letter-spacing:0.06em;margin-bottom:3px}
.tri span{font-size:calc(var(--u)*1.15);color:#e2e8f0;line-height:1.4;display:block}

/* ===================================================================
   5. TRANSITION — GRAVITATIONAL CURTAIN
   =================================================================== */
#grav-curtain{position:absolute;inset:0;z-index:50;pointer-events:none;background:radial-gradient(ellipse at 50% 90%,#101830,#060913 80%);transform:translateY(-100%)}
#grav-curtain.anim-fwd{animation:curtainFwd 1.28s var(--g) both}
#grav-curtain.anim-bwd{animation:curtainBwd 1.12s var(--e) both}
@keyframes curtainFwd{0%{transform:translateY(-100%)}44%,56%{transform:translateY(0)}100%{transform:translateY(100%)}}
@keyframes curtainBwd{0%{transform:translateY(100%)}44%,56%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.impact-wave{position:absolute;left:50%;top:50%;width:calc(var(--u)*14);aspect-ratio:1;border-radius:50%;border:2px solid var(--brass);transform:translate(-50%,-50%) scale(0.1);animation:impactRing 0.95s ease-out forwards;pointer-events:none;z-index:45}
@keyframes impactRing{to{transform:translate(-50%,-50%) scale(9);opacity:0}}

/* ===================================================================
   6. CHROME
   =================================================================== */
#ornament-frame{position:absolute;inset:calc(var(--u)*1.6);z-index:25;pointer-events:none;border:1px solid rgba(212,175,55,0.22)}
#ornament-frame::before{content:"";position:absolute;inset:calc(var(--u)*0.5);border:0.5px solid rgba(212,175,55,0.1)}
.bracket{position:absolute;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);color:var(--brass)}
.bracket.tl{top:-2px;left:-2px}.bracket.tr{top:-2px;right:-2px;transform:rotate(90deg)}
.bracket.br{bottom:-2px;right:-2px;transform:rotate(180deg)}.bracket.bl{bottom:-2px;left:-2px;transform:rotate(270deg)}
#ui-chrome{position:absolute;inset:0;z-index:30;pointer-events:none;transition:opacity 0.5s}
body.hero-slide #ui-chrome{opacity:0}
#counter{position:absolute;left:calc(var(--u)*4.2);bottom:calc(var(--u)*2.5);font:800 calc(var(--u)*1.1) var(--f-body);letter-spacing:0.24em;color:var(--brass)}
#progress{position:absolute;left:calc(var(--u)*4.2);bottom:calc(var(--u)*2.1);width:calc(var(--u)*14);height:3px;background:rgba(255,255,255,0.12);border-radius:99px;overflow:hidden}
#progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--cyan));transform-origin:left;transform:scaleX(0.11);transition:transform 0.65s var(--e)}
#feather-canvas,#dust{position:absolute;inset:0;pointer-events:none}
#feather-canvas{z-index:7}#dust{z-index:8}

/* Overlays */
#lightbox,#modal-grid{position:fixed;inset:0;z-index:120;background:rgba(2,4,12,0.96);display:none;place-items:center;padding:4vh 4vw;backdrop-filter:blur(12px)}
#lightbox.active,#modal-grid.active{display:grid}
#lightbox img{max-width:min(90vw,150vh);max-height:86vh;border-radius:10px;border:2px solid var(--brass)}
#lightbox-close{position:absolute;top:22px;right:30px;font:700 22px var(--f-body);color:#fff;background:rgba(255,255,255,0.14);width:42px;height:42px;border-radius:50%}
.grid-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:2vmin;width:min(90vw,150vh)}
.grid-thumb{aspect-ratio:16/9;border:1.5px solid rgba(212,175,55,0.3);border-radius:8px;padding:1.5vmin;display:flex;flex-direction:column;justify-content:flex-end;background:#0c1224;cursor:pointer;transition:transform 0.3s var(--pop),border-color 0.3s}
.grid-thumb:hover{transform:translateY(-4px);border-color:var(--cyan)}
.grid-thumb.cur{border-color:#fff}
.grid-thumb b{font:800 2.6vmin var(--f-body);color:var(--brass)}
.grid-thumb span{font:600 1.6vmin var(--f-body);color:#fff}
.floating-btns{position:fixed;right:12px;bottom:12px;z-index:90;display:flex;gap:6px;opacity:0.3;transition:opacity 0.3s}
.floating-btns:hover{opacity:1}
.floating-btn{padding:6px 12px;border:1px solid var(--brass);border-radius:99px;background:rgba(6,9,19,0.9);color:var(--brass);font:600 11px var(--f-body)}
.floating-btn:hover{background:var(--brass);color:#000}
body.edit-mode .floating-btns{display:none}
#notes-drawer{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%);width:min(860px,92vw);max-height:36vh;z-index:95;background:rgba(6,10,24,0.95);border:1.5px solid var(--brass);border-radius:14px;padding:16px 22px;color:#f1f5f9;box-shadow:0 16px 48px rgba(0,0,0,0.85);transition:transform 0.4s var(--e);overflow-y:auto}
#notes-drawer.active{transform:translateX(-50%) translateY(0)}
#notes-drawer header{display:flex;justify-content:space-between;font:700 12px var(--f-body);color:var(--brass);letter-spacing:0.12em;margin-bottom:8px;border-bottom:1px solid rgba(212,175,55,0.25);padding-bottom:6px}
#notes-content{font:400 15px/1.7 var(--f-body);white-space:pre-line}
#editor-panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);z-index:110;background:#09102a;border-left:1px solid var(--brass);color:#f1f5f9;display:none;flex-direction:column;font-size:13px}
body.edit-mode #editor-panel{display:flex}
#editor-panel header{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(212,175,55,0.3);font-weight:700;color:var(--brass)}
.editor-body{flex:1;overflow-y:auto;padding:16px}
.editor-body label{display:block;margin:10px 0 4px;font-weight:600;color:#93c5fd}
.editor-body textarea{width:100%;background:#050814;border:1px solid rgba(212,175,55,0.35);color:#fff;padding:8px;border-radius:6px;font:13px/1.4 var(--f-body)}
.editor-actions{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-top:1px solid rgba(212,175,55,0.3)}
.editor-actions button,.editor-actions label{padding:7px 11px;background:rgba(212,175,55,0.14);border:1px solid var(--brass);border-radius:6px;font-size:12px;color:#fef08a;cursor:pointer}
.editor-actions input{display:none}
</style>
</head>

<script>
(function(){'use strict';

/* ===================================================================
   1. HELPERS
   =================================================================== */
const MEMBERS=[
  'Phạm Ngọc Minh Châu','Nguyễn Huy Bách','Trần Hoài An','Vũ Thanh Tùng',
  'Đinh Bảo Việt','Nguyễn Dương Anh Dũng','Vũ Tiến Khang','Đỗ Hoàng Bảo Ngọc',
  'Dương Tuấn Anh','Phạm Như Đức Minh','Trần Ngọc Tình','Lê Quang Tuấn Đạt'
];
const initial=n=>{const p=n.trim().split(' ');return p[p.length-1].charAt(0).toUpperCase();};
function splitChars(text,l){
  let ci=0;
  return text.split(' ').map(w=>`<span class="wd">${Array.from(w).map(c=>`<span class="ch" data-c="${c}" style="--c:${ci++};--l:${l}">${c}</span>`).join('')}</span>`).join(' ');
}
const splitWords=t=>t.split(' ').map((w,i)=>`<span class="pw" style="--w:${i}">${w}</span>`).join(' ');
const marquee=()=>{const m=MEMBERS.map(x=>`<span>${x}</span>`).join('');return `<div class="members-strip"><div class="members-strip-inner">${m}${m}</div></div>`;};

/* Feather glyph (inline SVG) */
const featherSVG=()=>`<svg viewBox="-10 -18 20 38"><path d="M0 -16 C8 -9 8 7 1 16 L-1 16 C-8 7 -8 -9 0 -16Z" fill="#f8fafc"/><line x1="0" y1="-16" x2="0" y2="19" stroke="#d4af37" stroke-width="1.2"/></svg>`;

/* Animated astrolabe ornament */
function astroSVG(){
  let ticks='';
  for(let i=0;i<48;i++){const a=i*7.5*Math.PI/180,r1=i%4?42:38,r2=46;
    ticks+=`<line x1="${(50+r1*Math.sin(a)).toFixed(2)}" y1="${(50-r1*Math.cos(a)).toFixed(2)}" x2="${(50+r2*Math.sin(a)).toFixed(2)}" y2="${(50-r2*Math.cos(a)).toFixed(2)}" stroke="#d4af37" stroke-width="${i%4?0.6:1.3}"/>`;}
  return `<svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="rgba(6,9,19,0.7)" stroke="#d4af37" stroke-width="1.2"/>
    <g class="astro-spin">${ticks}<circle cx="50" cy="50" r="34" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-dasharray="3 3"/></g>
    <g class="astro-rev"><circle cx="50" cy="50" r="24" fill="none" stroke="#38bdf8" stroke-width="0.9"/>
      <path d="M50 22 L54 50 L50 78 L46 50Z" fill="rgba(246,224,130,0.85)"/><path d="M22 50 L50 46 L78 50 L50 54Z" fill="rgba(56,189,248,0.6)"/></g>
    <circle cx="50" cy="50" r="4" fill="#f6e082"/>
    <g class="astro-orbit"><circle cx="50" cy="9" r="3" fill="#38bdf8"/></g>
  </svg>`;
}

/* Animated Leaning Tower of Pisa with two balls dropping together */
function pisaSVG(){
  let t='';
  for(let k=0;k<7;k++){const y=333-k*36;
    t+=`<rect x="58" y="${y}" width="64" height="36" fill="url(#pisaStone)" stroke="rgba(120,100,60,0.55)" stroke-width="1"/>`;
    t+=`<line x1="55" y1="${y}" x2="125" y2="${y}" stroke="#d4af37" stroke-width="1.8"/>`;
    for(let a=0;a<5;a++){const x=61+a*12;t+=`<path d="M${x} ${y+33} v-15 a4.5 4.5 0 0 1 9 0 v15" fill="rgba(20,24,40,0.55)" stroke="rgba(120,100,60,0.5)" stroke-width="0.8"/>`;}
  }
  const ghosts=[16.7,66.8,150.2].map(d=>`<circle cx="150" cy="${95+d}" r="8" fill="#64748b" opacity="0.18"/><circle cx="170" cy="${98.5+d}" r="4.5" fill="#e2e8f0" opacity="0.18"/>`).join('');
  return `<svg viewBox="0 0 200 400" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="pisaStone" x1="0" x2="1"><stop offset="0" stop-color="#cbbf9f"/><stop offset="0.5" stop-color="#f4ecd8"/><stop offset="1" stop-color="#a99d7e"/></linearGradient>
      <radialGradient id="ballG" cx="35%" cy="30%"><stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#1e293b"/></radialGradient>
    </defs>
    <circle cx="36" cy="58" r="16" fill="rgba(246,224,130,0.16)"/>
    <g transform="rotate(5 90 370)">
      ${t}
      <rect x="66" y="87" width="48" height="30" fill="url(#pisaStone)" stroke="rgba(120,100,60,0.6)"/>
      <path d="M72 115 v-14 a4 4 0 0 1 8 0 v14 M86 115 v-14 a4 4 0 0 1 8 0 v14 M100 115 v-14 a4 4 0 0 1 8 0 v14" fill="rgba(20,24,40,0.6)"/>
      <path d="M63 87 L117 87 L108 77 L72 77Z" fill="#d4af37"/>
    </g>
    ${ghosts}
    <g class="pisa-ball"><circle cx="150" cy="95" r="8" fill="url(#ballG)" stroke="#f6e082" stroke-width="1"/></g>
    <g class="pisa-ball"><circle cx="170" cy="98.5" r="4.5" fill="#f1f5f9" stroke="#38bdf8" stroke-width="1"/></g>
    <rect x="0" y="370" width="200" height="30" fill="rgba(212,175,55,0.08)"/>
    <line x1="0" y1="370" x2="200" y2="370" stroke="#d4af37" stroke-width="2"/>
    <ellipse class="pisa-impact" cx="160" cy="370" rx="22" ry="4" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="100" y="394" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="13" font-weight="800" fill="#f6e082" letter-spacing="2">THÁP PISA · 1589</text>
  </svg>`;
}

/* Animated Newton tubes: air vs vacuum */
function tubeSVG(){
  let dots='';
  for(let i=0;i<16;i++){dots+=`<circle class="air-dot" cx="${30+Math.random()*60}" cy="${55+Math.random()*290}" r="1.6" fill="rgba(186,230,253,0.55)" style="animation-delay:${(-Math.random()*5).toFixed(2)}s"/>`;}
  const stone=x=>`<polygon points="${x-8},56 ${x+4},52 ${x+10},62 ${x+5},72 ${x-6},71 ${x-11},63" fill="url(#stoneG)" stroke="#94a3b8" stroke-width="0.8"/>`;
  const feather=`<path d="M0 -15 C7 -9 8 6 1 15 L-1 15 C-8 6 -7 -9 0 -15Z" fill="#f8fafc"/><line x1="0" y1="-15" x2="0" y2="18" stroke="#d4af37" stroke-width="1.1"/>`;
  return `<svg viewBox="0 0 220 410" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="brassG" x1="0" x2="1"><stop offset="0" stop-color="#8b5e08"/><stop offset="0.5" stop-color="#f6e082"/><stop offset="1" stop-color="#8b5e08"/></linearGradient>
      <radialGradient id="stoneG" cx="35%" cy="30%"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#334155"/></radialGradient>
    </defs>
    <rect x="22" y="40" width="76" height="318" rx="10" fill="rgba(56,189,248,0.07)" stroke="rgba(186,230,253,0.6)" stroke-width="1.5"/>
    <rect x="122" y="40" width="76" height="318" rx="10" fill="rgba(56,189,248,0.04)" stroke="rgba(246,224,130,0.75)" stroke-width="1.5"/>
    <line x1="30" y1="52" x2="30" y2="346" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    <line x1="130" y1="52" x2="130" y2="346" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    ${dots}
    <rect x="14" y="26" width="92" height="16" rx="4" fill="url(#brassG)"/><rect x="114" y="26" width="92" height="16" rx="4" fill="url(#brassG)"/>
    <rect x="14" y="356" width="92" height="16" rx="4" fill="url(#brassG)"/><rect x="114" y="356" width="92" height="16" rx="4" fill="url(#brassG)"/>
    <line x1="160" y1="26" x2="160" y2="10" stroke="#d4af37" stroke-width="3"/><circle cx="160" cy="8" r="6" fill="#f6e082"/>
    <g class="tube-fast">${stone(46)}</g>
    <g transform="translate(78 64)"><g class="tube-slow"><g class="sway">${feather}</g></g></g>
    <g class="tube-fast">${stone(146)}</g>
    <g transform="translate(178 64)"><g class="tube-fast">${feather}</g></g>
    <ellipse class="tube-impact" cx="60" cy="354" rx="30" ry="3.5" fill="rgba(56,189,248,0.75)"/>
    <ellipse class="tube-impact" cx="160" cy="354" rx="32" ry="4" fill="rgba(246,224,130,0.9)"/>
    <text x="60" y="396" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="13" font-weight="800" fill="#7dd3fc">KHÔNG KHÍ</text>
    <text x="160" y="396" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="13" font-weight="800" fill="#f6e082">CHÂN KHÔNG</text>
  </svg>`;
}

/* Measuring ruler with falling stone & feather */
function dropRuler(style,vac,flip,label){
  return `<div class="drop-ruler ${vac?'vac':''} ${flip?'flip':''}" style="${style}">
    <div class="dr-track">
      <div class="dr-fall fast"><span class="dr-stone"></span></div>
      <div class="dr-fall ${vac?'fast':'slow'}"><span class="dr-feather">${featherSVG()}</span></div>
    </div>
    <div class="dr-label">${label}</div>
  </div>`;
}

/* ===================================================================
   2. SLIDES DATA (9 slides)
   =================================================================== */
const SLIDES=[
  /* ---------- 01 · CHÀO ---------- */
  {
    id:'W',hero:true,name:'Chào Mừng',theme:'renaissance',
    kicker:'Vật Lý 10',title:'SỰ RƠI TRONG KHÔNG KHÍ',
    notes:`"Kính thưa thầy cô và các bạn! Chào mừng thầy cô và các bạn đến với bài thuyết trình môn Vật Lý 10 của nhóm chúng em với chủ đề: Sự rơi trong không khí – Từ triết học cổ đại đến cơ học cổ điển."`,
    render:()=>`
      <div class="opener-rays"></div><div class="grid-floor"></div>
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="scene rv" style="--i:3;left:calc(var(--u)*3.5);bottom:calc(var(--u)*5.5);width:calc(var(--u)*17);height:calc(var(--u)*38);">${pisaSVG()}</div>
      <div class="scene rv" style="--i:4;right:calc(var(--u)*3.5);bottom:calc(var(--u)*5.5);width:calc(var(--u)*17);height:calc(var(--u)*36);">${tubeSVG()}</div>
      <div class="hero-center">
        <div class="kicker rv" style="--i:0;">✦ Chào mừng thầy cô và các bạn ✦</div>
        <h1 class="hero-title">
          <span class="hline fit l1">${splitChars('SỰ RƠI TRONG',0)}</span>
          <span class="hline fit l2">${splitChars('KHÔNG KHÍ',1)}</span>

      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="scene rv" style="--i:3;left:calc(var(--u)*3.5);bottom:calc(var(--u)*5.5);width:calc(var(--u)*17);height:calc(var(--u)*36);">${tubeSVG()}</div>
      <div class="scene rv" style="--i:4;right:calc(var(--u)*3.5);bottom:calc(var(--u)*5.5);width:calc(var(--u)*17);height:calc(var(--u)*38);">${pisaSVG()}</div>
      <div class="hero-center">
        <div class="kicker rv" style="--i:0;">✦ Sự rơi trong không khí · Vật Lý 10 ✦</div>
        <h2 class="hero-title">
          <span class="hline fit l1">${splitChars('CẢM ƠN THẦY CÔ',0)}</span>
          <span class="hline fit l1">${splitChars('VÀ CÁC BẠN',1)}</span>
        </h2>
        <div class="hero-sub rv" style="--i:2;font-size:calc(var(--u)*3);color:var(--brass-light);font-style:normal;font-weight:900;">ĐÃ CHÚ Ý LẮNG NGHE!</div>
        <p class="hero-lead">${splitWords('"Những gì mắt thấy chưa hẳn là chân lý — hãy phân tích khoa học và kiểm chứng bằng thực nghiệm."')}</p>
        <div class="pillars rv" style="--i:4;">
          <div class="pillar"><div class="pillar-num">I</div><div><b>Aristotle</b><span>Trực giác</span></div></div>
          <div class="pillar"><div class="pillar-num" style="background:linear-gradient(135deg,#0284c7,#38bdf8);">II</div><div><b style="color:#7dd3fc;">Galileo</b><span>Tách bạch sức cản</span></div></div>
          <div class="pillar"><div class="pillar-num">III</div><div><b>Newton</b><span>Thực nghiệm chứng minh</span></div></div>
        </div>
        <div class="rv" style="--i:5;margin-top:calc(var(--u)*1.6);display:flex;gap:calc(var(--u)*1.5);">
          <span class="gold-badge">💬 Mời đặt câu hỏi</span>
          <button class="gold-badge cyan" onclick="goToSlideIndex(0)">↺ Xem lại từ đầu</button>
        </div>
      </div>
      ${marquee()}`
  }
];

/* ===================================================================
   3. RENDERER
   =================================================================== */
const deck=document.getElementById('deck');
const stage=document.getElementById('stage');
const counterEl=document.getElementById('counter');
const progressEl=document.querySelector('#progress i');
const curtain=document.getElementById('grav-curtain');
let cur=0,navigating=false;

function headHTML(s){
  return `<div class="slide-head">
    <div class="kicker rv" style="--i:0;">${s.kicker}</div>
    <h2 class="headline fit"><span class="hline">${splitChars(s.title,0)}</span></h2>
  </div>`;
}
function renderSlides(){
  deck.innerHTML='';
  SLIDES.forEach((s,idx)=>{
    const sec=document.createElement('section');
    sec.className='sc';sec.dataset.th=s.theme;sec.dataset.index=idx;
    sec.setAttribute('aria-label',s.name);
    sec.innerHTML=`<div class="bgl"></div>
      <div class="cam parallax-layer" data-depth="0.3">
        ${s.hero?'':headHTML(s)}
        ${s.render()}
        ${s.hero?'':`<div class="orn rv" style="--i:2;">${astroSVG()}</div>`}
      </div>`;
    deck.appendChild(sec);
  });
}

/* Shrink single-line titles until they fit their box */
function fitIn(sec){
  if(!sec)return;
  sec.querySelectorAll('.fit').forEach(el=>{
    el.style.fontSize='';
    let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    while(el.scrollWidth>el.clientWidth+1&&n<40){fs*=0.97;el.style.fontSize=fs+'px';n++;}
  });
}

/* ===================================================================
   4. AMBIENT CANVASES (falling feathers + dust)
   =================================================================== */
function makeCanvas(id,count,make,draw){
  const cv=document.getElementById(id),ctx=cv.getContext('2d');let W=0,H=0,P=[];
  function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=cv.width=Math.round(r.width*d);H=cv.height=Math.round(r.height*d);cv.style.width=r.width+'px';cv.style.height=r.height+'px';}
  function init(){resize();P=Array.from({length:count},()=>{const p=make(W,H);p.y=Math.random()*H;return p;});}
  function tick(){ctx.clearRect(0,0,W,H);P.forEach((p,i)=>{if(draw(ctx,p,W,H))P[i]=make(W,H);});requestAnimationFrame(tick);}
  return{init,resize,tick};
}
const Feathers=makeCanvas('feather-canvas',18,
  (W,H)=>({x:Math.random()*W,y:-30,vx:(Math.random()-0.5)*0.4,vy:0.3+Math.random()*0.5,a:Math.random()*6.28,av:(Math.random()-0.5)*0.02,len:14+Math.random()*18,al:0.1+Math.random()*0.25,s:Math.random()*6.28,ss:0.008+Math.random()*0.012}),
  (ctx,f,W,H)=>{f.s+=f.ss;f.x+=f.vx+Math.sin(f.s)*0.6;f.y+=f.vy;f.a+=f.av;
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.globalAlpha=f.al;ctx.strokeStyle='rgba(243,234,216,0.9)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(0,-f.len/2);ctx.lineTo(0,f.len/2);ctx.stroke();ctx.lineWidth=0.5;
    const st=Math.floor(f.len/2.2);for(let i=0;i<st;i++){const y=-f.len/2+i*2.2,sp=f.len*0.38*(1-Math.abs(i/st-0.5)*1.6);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(-sp,y+sp*0.5);ctx.moveTo(0,y);ctx.lineTo(sp,y+sp*0.5);ctx.stroke();}
    ctx.restore();return f.y>H+30;});
const Dust=makeCanvas('dust',36,
  (W,H)=>({x:Math.random()*W,y:-5,r:0.6+Math.random()*1.6,vx:(Math.random()-0.5)*0.25,vy:0.15+Math.random()*0.35,al:0.3+Math.random()*0.5}),
  (ctx,p,W,H)=>{p.x+=p.vx;p.y+=p.vy;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fillStyle=`rgba(212,175,55,${p.al})`;ctx.fill();return p.y>H+5;});

/* Pointer parallax */
let mx=0,my=0,smx=0,smy=0;
stage.addEventListener('mousemove',e=>{const r=stage.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*2-1;my=(e.clientY-r.top)/r.height*2-1;});
(function parallax(){smx+=(mx-smx)*0.07;smy+=(my-smy)*0.07;
  document.querySelectorAll('.sc.on .parallax-layer').forEach(el=>{el.style.transform=`translate(${smx*5}px,${smy*3}px)`;});
  requestAnimationFrame(parallax);})();

/* ===================================================================
   5. NAVIGATION
   =================================================================== */
const notesDrawer=document.getElementById('notes-drawer');
function updateUI(){
  counterEl.textContent=`${String(cur+1).padStart(2,'0')} / ${String(SLIDES.length).padStart(2,'0')}`;
  progressEl.style.transform=`scaleX(${(cur+1)/SLIDES.length})`;
  document.body.classList.toggle('hero-slide',!!SLIDES[cur].hero);
  document.getElementById('notes-title').textContent='LỜI DẪN: '+SLIDES[cur].name.toUpperCase();
  document.getElementById('notes-content').textContent=SLIDES[cur].notes||'';
  history.replaceState(null,'','#slide-'+String(cur+1).padStart(2,'0'));
}
function goTo(idx,dir=1){
  if(navigating||idx===cur||idx<0||idx>=SLIDES.length)return;
  navigating=true;
  ['player-vid01','player-2mp4'].forEach(id=>{const v=document.getElementById(id);if(v)v.pause();});
  const secs=document.querySelectorAll('.sc');
  curtain.className=dir>0?'anim-fwd':'anim-bwd';
  setTimeout(()=>{
    secs[cur].classList.remove('on');
    secs[idx].classList.add('on');
    cur=idx;updateUI();fitIn(secs[idx]);
    const ring=document.createElement('div');ring.className='impact-wave';stage.appendChild(ring);setTimeout(()=>ring.remove(),950);
  },560);
  setTimeout(()=>{curtain.className='';navigating=false;},1300);
}
window.goToSlideIndex=i=>goTo(i,i>cur?1:-1);

let wDelta=0,wTimer=null;
window.addEventListener('wheel',e=>{
  if(document.body.classList.contains('edit-mode')||document.getElementById('lightbox').classList.contains('active')||e.target.closest('#notes-drawer'))return;
  e.preventDefault();if(navigating)return;
  wDelta+=e.deltaY;clearTimeout(wTimer);wTimer=setTimeout(()=>{wDelta=0},140);
  if(Math.abs(wDelta)>55){const d=wDelta>0?1:-1;wDelta=0;goTo(cur+d,d);}
},{passive:false});
let tY=0;
window.addEventListener('touchstart',e=>{tY=e.touches[0].clientY},{passive:true});
window.addEventListener('touchend',e=>{const d=tY-e.changedTouches[0].clientY;if(Math.abs(d)>50)goTo(cur+(d>0?1:-1),d>0?1:-1);},{passive:true});
window.addEventListener('keydown',e=>{
  if(e.target.matches('textarea,input'))return;
  if(e.target.tagName==='VIDEO'&&e.key===' ')return;
  if(e.key==='Escape'){closeAll();return;}
  if(['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();goTo(cur+1,1);}
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goTo(cur-1,-1);}
  else if(e.key==='Home'){e.preventDefault();goTo(0,-1);}
  else if(e.key==='End'){e.preventDefault();goTo(SLIDES.length-1,1);}
  else if(e.key==='g'||e.key==='G')toggleGrid();
  else if(e.key==='n'||e.key==='N')notesDrawer.classList.toggle('active');
  else if(e.key==='s'||e.key==='S')toggleEditor();
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/slide-(\d+)/);if(m)window.goToSlideIndex(parseInt(m[1],10)-1);});

/* ===================================================================
   6. LIGHTBOX · GRID · NOTES · EDITOR
   =================================================================== */
const lightbox=document.getElementById('lightbox');
window.openLightbox=src=>{document.getElementById('lightbox-img').src=src;lightbox.classList.add('active');};
document.getElementById('lightbox-close').onclick=()=>lightbox.classList.remove('active');
lightbox.onclick=e=>{if(e.target===lightbox)lightbox.classList.remove('active');};
const modalGrid=document.getElementById('modal-grid');
function toggleGrid(){
  if(!modalGrid.classList.toggle('active'))return;
  const shelf=document.getElementById('grid-shelf');
  shelf.innerHTML=SLIDES.map((s,i)=>`<div class="grid-thumb ${i===cur?'cur':''}" data-i="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${s.name}</span></div>`).join('');
  shelf.querySelectorAll('.grid-thumb').forEach(t=>t.onclick=()=>{modalGrid.classList.remove('active');window.goToSlideIndex(+t.dataset.i);});
}
function toggleEditor(){if(document.body.classList.toggle('edit-mode'))buildEditor();}
function closeAll(){lightbox.classList.remove('active');modalGrid.classList.remove('active');notesDrawer.classList.remove('active');document.body.classList.remove('edit-mode');}
document.getElementById('btn-notes-toggle').onclick=()=>notesDrawer.classList.toggle('active');
document.getElementById('notes-close').onclick=()=>notesDrawer.classList.remove('active');
document.getElementById('btn-grid-toggle').onclick=toggleGrid;
document.getElementById('btn-editor-open').onclick=toggleEditor;
document.getElementById('btn-editor-close').onclick=toggleEditor;
function buildEditor(){
  const s=SLIDES[cur],f=document.getElementById('editor-fields');
  f.innerHTML=`<h3 style="color:var(--brass);margin-bottom:12px;">${s.name}</h3>
    ${s.hero?'':`<label>Dòng chủ đề nhỏ:</label><textarea id="ed-k" rows="2">${s.kicker}</textarea>
    <label>Tiêu đề:</label><textarea id="ed-t" rows="2">${s.title}</textarea>`}
    <label>Lời dẫn:</label><textarea id="ed-n" rows="8">${s.notes||''}</textarea>`;
  f.querySelectorAll('textarea').forEach(ta=>ta.oninput=()=>{
    const sec=document.querySelectorAll('.sc')[cur];
    if(!s.hero){s.kicker=document.getElementById('ed-k').value;s.title=document.getElementById('ed-t').value;
      sec.querySelector('.slide-head .kicker').textContent=s.kicker;
      sec.querySelector('.slide-head .headline').innerHTML=`<span class="hline">${splitChars(s.title,0)}</span>`;fitIn(sec);}
    s.notes=document.getElementById('ed-n').value;updateUI();
  });
}
function swapVideo(inputId,playerId){
  document.getElementById(inputId).onchange=e=>{const file=e.target.files[0];if(!file)return;const v=document.getElementById(playerId);if(v){v.src=URL.createObjectURL(file);v.play();}};
}
swapVideo('input-galileo-video','player-vid01');
swapVideo('input-newton-video','player-2mp4');
document.getElementById('btn-save-html').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.documentElement.outerHTML],{type:'text/html'}));a.download='Su-Roi-Trong-Khong-Khi.html';a.click();
};

/* ===================================================================
   7. INIT
   =================================================================== */
renderSlides();
Feathers.init();Feathers.tick();
Dust.init();Dust.tick();
const start=(location.hash.match(/slide-(\d+)/)||[])[1];
cur=start?Math.min(Math.max(parseInt(start,10)-1,0),SLIDES.length-1):0;
const secs=document.querySelectorAll('.sc');
secs[cur].classList.add('on');
updateUI();fitIn(secs[cur]);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitIn(document.querySelectorAll('.sc')[cur]));
window.addEventListener('resize',()=>{Feathers.resize();Dust.resize();fitIn(document.querySelectorAll('.sc')[cur]);});
})();
</script>
